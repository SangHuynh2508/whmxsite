<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khí Giả — A · Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
<!--
  Direction A — Gallery Dark (roulette #18, huashu design-styles).
  Assumptions: the art (drawing, relic photo) is the only colour; UI recedes to hairlines and
  EXIF-like captions. Lore is read like wall labels: CN caption small above, VI large below.
  Data: real (public/data.json + development branch, A0144). The "tiếng Trung đã đổi" state on the
  relic intro and the two dirty fields are simulated to show every state.
-->
<style>
  :root {
    --bg-main:#111315; --bg-surface:#17191C; --bg-hover:#22262B; --bg-elevated:#1C2024;
    --border:#2B2F34; --border-strong:#3D434A; --text:#E3E5E8; --muted:#9097A0; --subtle:#6B7280;
    --accent:#D4B763; --accent-light:#24221A; --input:#1C2024; --input-border:#34383D;
    --ssr:#b93232; --sr:#c4a265; --r:#4e7091;
    --ease:cubic-bezier(0.2,0,0,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg-main); color:var(--text); font:15px/1.6 Inter, system-ui, sans-serif; }
  .serif { font-family:'Noto Serif SC', serif; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  /* Admin shell (approved Direction B): 60px rail + view header */
  .rail { position:fixed; inset:0 auto 0 0; width:60px; border-right:1px solid var(--border); background:var(--bg-surface); display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:14px; }
  .rail .logo { width:34px; height:34px; border:1px solid var(--accent); border-radius:6px; color:var(--accent); display:grid; place-items:center; font-family:'Noto Serif SC'; font-weight:600; }
  .rail i { width:22px; height:22px; border:1.5px solid var(--muted); border-radius:5px; opacity:.6; }
  .rail i.on { border-color:var(--accent); opacity:1; }
  main { margin-left:60px; min-height:100vh; }
  .viewhead { height:52px; display:flex; align-items:center; gap:14px; padding:0 28px; border-bottom:1px solid var(--border); }
  .viewhead b { font-weight:600; } .viewhead span { color:var(--subtle); font-size:13px; }

  /* ---------- List: gallery wall ---------- */
  .wall { padding:40px 44px 80px; }
  .wall-top { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:34px; }
  .wall-top h1 { font:400 34px/1.1 'Noto Serif SC', serif; letter-spacing:.02em; }
  .search { width:280px; background:transparent; border:0; border-bottom:1px solid var(--border-strong); color:var(--text); padding:8px 2px; font:inherit; }
  .search::placeholder { color:var(--subtle); }
  .filters { display:flex; gap:22px; font-size:13px; color:var(--muted); margin-top:10px; }
  .filters .on { color:var(--text); border-bottom:1px solid var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:40px 28px; }
  .work { text-align:left; }
  .frame { aspect-ratio:3/4; background:#0c0d0e; overflow:hidden; border-radius:2px; }
  .frame img { width:100%; height:100%; object-fit:cover; object-position:top; transition:transform .5s var(--ease), filter .5s var(--ease); filter:saturate(.92); }
  .work:hover .frame img { transform:scale(1.03); filter:saturate(1); }
  .cap { margin-top:12px; font-size:13px; }
  .cap b { font-weight:500; font-size:14px; } .cap .cn { color:var(--muted); margin-left:6px; }
  .exif { color:var(--subtle); font-size:12px; letter-spacing:.04em; display:flex; justify-content:space-between; margin-top:4px; }
  .meter { height:1px; background:var(--border); margin-top:8px; position:relative; }
  .meter i { position:absolute; inset:0 auto 0 0; background:var(--accent); }

  /* ---------- Record ---------- */
  .record { display:grid; grid-template-columns:minmax(320px,38%) 1fr; min-height:calc(100vh - 52px); }
  .plate { position:sticky; top:0; height:calc(100vh - 52px); background:#0c0d0e; display:flex; flex-direction:column; }
  .plate .art { flex:1; min-height:0; }
  .plate .art img { width:100%; height:100%; object-fit:contain; object-position:bottom center; }
  .plate .label { padding:18px 26px 22px; border-top:1px solid var(--border); font-size:12px; color:var(--subtle); letter-spacing:.05em; display:grid; grid-template-columns:auto 1fr; gap:4px 16px; }
  .plate .label dd { color:var(--muted); } .plate h1 { grid-column:1/-1; font:400 28px/1.2 'Noto Serif SC', serif; color:var(--text); letter-spacing:.02em; margin-bottom:6px; }
  .plate h1 small { font-size:15px; color:var(--muted); margin-left:10px; }
  .content { padding:30px 56px 140px; max-width:880px; }
  .back { color:var(--subtle); font-size:13px; }
  .modules { display:flex; gap:26px; margin:18px 0 38px; border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
  .modules button { padding:10px 0; font-size:14px; color:var(--muted); border-bottom:1px solid transparent; margin-bottom:-1px; white-space:nowrap; transition:color .18s var(--ease); }
  .modules button.on { color:var(--text); border-color:var(--accent); }
  .group { margin-bottom:56px; }
  .group > h2 { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:500; margin-bottom:22px; }
  .unit { padding:22px 0; border-top:1px solid var(--border); }
  .unit:first-of-type { border-top:0; padding-top:0; }
  .unit-head { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-bottom:10px; font-size:12px; color:var(--subtle); letter-spacing:.04em; }
  .unit-head b { color:var(--muted); font-weight:500; }
  .badge { font-size:11px; padding:1px 8px; border:1px solid var(--border-strong); border-radius:999px; color:var(--muted); }
  .badge.legacy { border-color:rgba(212,183,99,.35); color:var(--accent); }
  .badge.changed { border-color:rgba(210,92,76,.55); color:#F0A08F; }
  .cnline { font-family:'Noto Serif SC', serif; color:var(--muted); font-size:14px; line-height:1.9; white-space:pre-line; max-height:7.6em; overflow:hidden; position:relative; }
  .cnline.full { max-height:none; }
  .cnline:not(.full)::after { content:''; position:absolute; inset:auto 0 0 0; height:2.5em; background:linear-gradient(transparent, var(--bg-main)); }
  .more { font-size:12px; color:var(--subtle); margin-top:6px; }
  textarea.vi { width:100%; margin-top:14px; background:transparent; border:0; border-left:1px solid var(--border-strong); padding:4px 0 4px 16px; color:var(--text); font:16px/1.75 Inter, sans-serif; resize:none; field-sizing:content; min-height:3em; transition:border-color .18s var(--ease); }
  textarea.vi:focus { outline:none; border-left-color:var(--accent); }
  textarea.vi::placeholder { color:var(--subtle); font-style:italic; }
  .unit.dirty textarea.vi { border-left-color:var(--accent); }
  .unit-actions { display:flex; gap:16px; margin-top:8px; font-size:12px; color:var(--subtle); }
  .unit-actions button:hover { color:var(--text); }
  .relic { display:grid; grid-template-columns:200px 1fr; gap:28px; margin-bottom:26px; }
  .relic .photo { background:#0c0d0e; aspect-ratio:1; display:grid; place-items:center; }
  .relic .photo img { max-width:92%; max-height:92%; }
  .relic dl { display:grid; grid-template-columns:auto 1fr; gap:8px 18px; font-size:13px; align-content:start; }
  .relic dt { color:var(--subtle); letter-spacing:.05em; } .relic dd a { color:var(--text); text-decoration:none; border-bottom:1px dotted var(--border-strong); }
  .relic dd small { color:var(--subtle); margin-left:6px; }
  .savebar { position:fixed; left:calc(60px + 38%); right:0; bottom:0; display:flex; align-items:center; gap:18px; padding:14px 56px; background:rgba(17,19,21,.92); backdrop-filter:blur(8px); border-top:1px solid var(--border); font-size:13px; }
  .savebar .n { color:var(--accent); } .savebar .grow { flex:1; color:var(--subtle); }
  .btn { padding:8px 18px; border-radius:4px; font-size:13px; font-weight:500; transition:transform .12s var(--ease), background .18s var(--ease); }
  .btn:active { transform:scale(.97); }
  .btn.primary { background:var(--accent); color:#111315; } .btn.ghost { color:var(--muted); }
  @media (max-width:860px) {
    .wall { padding:24px 16px 80px; } .wall-top { flex-direction:column; align-items:stretch; } .search { width:100%; }
    .grid { grid-template-columns:repeat(2,1fr); gap:26px 14px; }
    .record { display:block; }
    .plate { position:relative; height:46vh; } .plate .label { padding:14px 16px; }
    .content { padding:18px 16px 140px; }
    .relic { grid-template-columns:minmax(0,1fr); } .relic .photo { width:100%; max-width:260px; }
    .savebar { left:0; padding:12px 16px; gap:10px; } .savebar .grow { display:none; } .savebar .n { flex:1; }
    main { margin-left:0; } .rail { display:none; }
    .viewhead { padding:0 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<nav class="rail"><div class="logo">物</div><i class="on"></i><i></i><i></i><i></i></nav>
<main>
  <div class="viewhead"><b>Khí Giả</b><span>Nhân vật · bản dịch tiếng Việt</span></div>
  <div id="app"></div>
</main>
<script src="data.js"></script>
<script>
const { list, record: R } = window.KG;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]);
const rare = { 4:'SSR', 3:'SR', 2:'R' };
const unit = (key) => R.units.find((u) => u.key === key);
const DIRTY = new Set(['card_intro', `report.${R.structure.reports[1].fileId}.content`]);
const SIM_CHANGED = 'relic_intro';

function listView() {
  return `<section class="wall">
    <div class="wall-top"><div><h1>Khí Giả</h1><div class="filters"><span class="on">Tất cả 133</span><span>Chưa dịch xong</span><span>Có bản cũ</span><span>Tiếng Trung đã đổi</span><span>Thuật ngữ lore →</span></div></div>
    <input class="search" placeholder="Tìm tên hoặc mã…" /></div>
    <div class="grid">${list.map((c) => { const p = c.progress; const pct = p ? Math.round((p.done / p.total) * 100) : 0; return `
      <button class="work" onclick="location.hash='#record'"><div class="frame"><img src="${esc(c.drawing || c.avatar)}" alt="" loading="lazy"></div>
      <div class="cap"><b>${esc(c.nameVi)}</b><span class="cn serif">${esc(c.nameCn)}</span>
      <div class="exif"><span>${c.id} · ${rare[c.rare] || ''}</span><span>${p ? `${p.done}/${p.total}${p.legacy ? ` · ${p.legacy} cũ` : ''}` : ''}</span></div>
      <div class="meter"><i style="width:${pct}%"></i></div></div></button>`; }).join('')}</div></section>`;
}

function unitBlock(key, label, extra = '') {
  const u = unit(key); if (!u) return '';
  const changed = key === SIM_CHANGED; const dirty = DIRTY.has(key);
  const badge = changed ? '<span class="badge changed">Tiếng Trung đã đổi</span>' : u.origin === 'legacy_workbook' ? '<span class="badge legacy">Bản cũ · chưa lưu</span>' : u.vi ? '' : '<span class="badge">Chưa dịch</span>';
  const long = u.cn.length > 160;
  const value = dirty ? (u.vi || '') + (key === 'card_intro' ? '' : '') : (u.vi || '');
  return `<div class="unit ${dirty ? 'dirty' : ''}">
    <div class="unit-head"><b>${label}</b>${extra}${badge}</div>
    <div class="cnline serif ${long ? '' : 'full'}">${esc(u.cn)}</div>${long ? '<div class="more">Hiện đủ tiếng Trung ↓</div>' : ''}
    <textarea class="vi" rows="${Math.min(12, Math.max(2, Math.ceil((u.vi || '').length / 70)))}" placeholder="Dịch tiếng Việt…">${esc(value)}</textarea>
    <div class="unit-actions">${u.origin === 'legacy_workbook' ? '<button>Dùng bản này</button>' : ''}${changed ? '<button>Xem tiếng Trung cũ</button>' : ''}<button>Phóng to</button><span>${(u.vi || '').length} ký tự</span></div>
  </div>`;
}

function recordView() {
  const t = R.terms; const reports = R.structure.reports;
  return `<section class="record">
    <aside class="plate"><div class="art"><img src="${esc(R.drawing)}" alt=""></div>
      <dl class="label"><h1>${esc(R.nameVi)}<small class="serif">${esc(R.nameCn)}</small></h1>
      <dt>MÃ</dt><dd>${R.id}</dd><dt>HỒ SƠ</dt><dd>${esc(R.recordId)}</dd><dt>TRỰC THUỘC</dt><dd>${esc(R.dept)}</dd><dt>ĐỘ HIẾM</dt><dd>${rare[R.rare]}</dd></dl></aside>
    <div class="content">
      <button class="back" onclick="location.hash='#list'">← Khí Giả</button>
      <nav class="modules"><button>Tổng quan</button><button class="on">Lore</button><button>Trang phục</button><button>Nguồn</button><button>Lịch sử</button></nav>
      <div class="group"><h2>Giới thiệu</h2>${unitBlock('card_intro', 'Đánh giá')}</div>
      <div class="group"><h2>Báo cáo quan sát</h2>${reports.map((r, i) => {
        const lvl = r.unlock.type === 2 ? Number(r.unlock.elementId) : null;
        const unlock = lvl ? `<span>Mở khoá: thiện cảm ${lvl} · <span class="serif">${esc(R.affinity[lvl] || '')}</span></span>` : '';
        return unitBlock(`report.${r.fileId}.title`, `Tiêu đề ${i + 1}`, unlock) + unitBlock(`report.${r.fileId}.content`, `Nội dung ${i + 1}`);
      }).join('')}</div>
      <div class="group"><h2>Hiện vật</h2>
        <div class="relic"><div class="photo"><img src="${esc(R.archive.image)}" alt=""></div>
        <dl><dt>LOẠI</dt><dd><a href="#">${esc(t.type?.cn)}</a><small>chưa dịch</small></dd><dt>TRIỀU ĐẠI</dt><dd><a href="#">${esc(t.era?.cn)}</a><small>chưa dịch</small></dd>
        <dt>BẢO TÀNG</dt><dd><a href="#">${esc(t.museum?.cn)}</a><small>chưa dịch</small></dd><dt>GIAI ĐOẠN</dt><dd><a href="#">${esc(t.range?.cn)}</a></dd></dl></div>
        ${unitBlock('relic_intro', 'Giới thiệu hiện vật')}</div>
      <div class="group"><h2>Dòng thời gian</h2>${R.structure.timeline.map((s) => unitBlock(`timeline.${s}.label`, `Mốc ${s}`) + unitBlock(`timeline.${s}.story`, `Câu chuyện ${s}`)).join('')}</div>
    </div>
    <div class="savebar"><span class="n">2 thay đổi chưa lưu</span><span class="grow">Lưu xong sẽ tự xuất bản sau 30 giây · Ctrl+S</span><button class="btn ghost">Bỏ thay đổi</button><button class="btn primary">Lưu</button></div>
  </section>`;
}
const render = () => { document.getElementById('app').innerHTML = location.hash === '#list' ? listView() : recordView(); scrollTo(0, 0); };
addEventListener('hashchange', render); render();
</script>
</body>
</html>
