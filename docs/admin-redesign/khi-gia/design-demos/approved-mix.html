<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khí Giả — hướng đã chốt (B + C)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<!--
  Approved mix (owner, 2026-09-25):
  - Record = B (workbench: unit list · editor · context, tabs in the header, chip strip on phones)
    with C's bilingual pairs in the middle (no field boxes; a hairline left of the VI text that turns
    gold on focus/dirty) and thin dark scrollbars.
  - List = C (register index) with the search focus fixed: no white box, the underline turns gold.
  Data real (A0144); "đã đổi" state and 2 dirty units simulated.
-->
<style>
  :root {
    --bg-main:#111315; --bg-surface:#17191C; --bg-hover:#22262B; --bg-elevated:#1C2024;
    --border:#2B2F34; --border-strong:#3D434A; --text:#E3E5E8; --muted:#9097A0; --subtle:#6B7280;
    --accent:#D4B763; --accent-light:#24221A; --ssr-text:#F0A08F; --ease:cubic-bezier(0.2,0,0,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent; }
  html, body { overflow-x:clip; } /* clip, not hidden: hidden breaks the sticky chip strip on phones */
  body { background:var(--bg-main); color:var(--text); font:14px/1.55 Inter, system-ui, sans-serif; }
  .serif { font-family:'Noto Serif SC', serif; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  a { color:inherit; }
  :focus { outline:none; }
  :focus-visible { outline:1px solid var(--accent); outline-offset:3px; border-radius:2px; }
  .rail { position:fixed; inset:0 auto 0 0; width:60px; border-right:1px solid var(--border); background:var(--bg-surface); display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:14px; z-index:5; }
  .rail .logo { width:34px; height:34px; border:1px solid var(--accent); border-radius:6px; color:var(--accent); display:grid; place-items:center; font-family:'Noto Serif SC'; font-weight:600; }
  .rail i { width:22px; height:22px; border:1.5px solid var(--muted); border-radius:5px; opacity:.6; } .rail i.on { border-color:var(--accent); opacity:1; }
  main { margin-left:60px; height:100vh; display:flex; flex-direction:column; }
  .viewhead { height:48px; flex:none; display:flex; align-items:center; gap:14px; padding:0 20px; border-bottom:1px solid var(--border); }
  .viewhead b { font-weight:600; } .viewhead span { color:var(--subtle); font-size:13px; }
  .viewhead .crumb { color:var(--muted); font-size:13px; } .viewhead .crumb a { color:var(--muted); text-decoration:none; }

  /* ---------- List: C register index ---------- */
  .scroll { flex:1; overflow:auto; }
  .index { max-width:1100px; margin:0 auto; padding:56px 40px 120px; font-size:15px; line-height:1.7; }
  .index h1 { font:400 13px/1 Inter; letter-spacing:.3em; color:var(--subtle); text-transform:uppercase; }
  .index .lead { font:400 40px/1.25 'Noto Serif SC', serif; margin:18px 0 36px; }
  .index .lead small { display:block; font:400 14px/1.6 Inter; color:var(--muted); margin-top:10px; }
  .find { display:flex; gap:28px; align-items:baseline; border-bottom:1px solid var(--border-strong); padding-bottom:12px; margin-bottom:12px; flex-wrap:wrap; transition:border-color .18s var(--ease); }
  .find:focus-within { border-bottom-color:var(--accent); }
  .find input, .find input:focus-visible { outline:none; }
  .find input { flex:1; min-width:200px; background:transparent; border:0; color:var(--text); font:400 18px Inter; }
  .find input::placeholder { color:var(--subtle); }
  .find button { font-size:13px; color:var(--subtle); transition:color .18s var(--ease); } .find button:hover, .find button.on { color:var(--text); }
  .entries { columns:2; column-gap:64px; }
  .entry { break-inside:avoid; display:grid; grid-template-columns:44px 1fr auto; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); width:100%; text-align:left; transition:background .18s var(--ease); }
  .entry:hover { background:linear-gradient(90deg, transparent, var(--bg-surface), transparent); }
  .entry img { width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--bg-elevated); }
  .entry .n { font:400 17px/1.3 'Noto Serif SC', serif; } .entry .n small { color:var(--subtle); font-size:13px; margin-left:8px; }
  .entry .id { font-size:12px; color:var(--subtle); letter-spacing:.08em; }
  .entry .frac { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
  .entry .frac small { display:block; color:var(--accent); font-size:11px; }

  /* ---------- Record: B workbench ---------- */
  .rechead { flex:none; display:flex; align-items:center; gap:14px; padding:10px 20px; border-bottom:1px solid var(--border); }
  .rechead img { width:36px; height:36px; border-radius:6px; object-fit:cover; }
  .rechead h1 { font-size:16px; font-weight:600; } .rechead h1 small { font-weight:400; color:var(--subtle); margin-left:6px; }
  .tabs { display:flex; gap:2px; margin-left:24px; }
  .tabs button { white-space:nowrap; padding:6px 12px; border-radius:6px; color:var(--muted); font-size:13px; transition:background .12s var(--ease), color .12s var(--ease); }
  .tabs button.on { background:var(--bg-elevated); color:var(--text); box-shadow:inset 0 -2px 0 var(--accent); }
  .panes { flex:1; min-height:0; display:grid; grid-template-columns:260px 1fr 280px; }
  .units { position:relative; border-right:1px solid var(--border); overflow:auto; padding:10px 0; }
  .units .grp { font-size:11px; letter-spacing:.12em; color:var(--subtle); padding:12px 16px 6px; text-transform:uppercase; }
  .units button { display:flex; gap:8px; align-items:flex-start; width:100%; text-align:left; padding:7px 16px; border-left:2px solid transparent; transition:background .12s var(--ease); }
  .units button:hover { background:var(--bg-hover); }
  .units button.on { background:var(--accent-light); border-left-color:var(--accent); }
  .units .t { font-size:13px; } .units .p { font-size:12px; color:var(--subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:190px; }
  .dot { display:inline-block; flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px; }

  /* Middle: C facing pairs — no boxes, a hairline left of the VI text */
  .editor { overflow:auto; }
  .edhead { position:sticky; top:0; z-index:2; display:grid; grid-template-columns:1fr 1fr; gap:48px; padding:10px 32px; background:var(--bg-main); border-bottom:1px solid var(--border); font-size:11px; letter-spacing:.3em; color:var(--subtle); text-transform:uppercase; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px 48px; padding:24px 32px; border-top:1px solid var(--border); scroll-margin-top:40px; }
  .row:first-of-type { border-top:0; }
  .cap { grid-column:1/-1; display:flex; gap:14px; align-items:baseline; font-size:12px; color:var(--subtle); letter-spacing:.04em; flex-wrap:wrap; }
  .cap b { color:var(--muted); font-weight:500; transition:color .12s var(--ease); }
  .row.on .cap b { color:var(--accent); }
  .orig { font-family:'Noto Serif SC', serif; font-size:15px; line-height:2; color:#b9bec5; white-space:pre-line; min-width:0; }
  .viwrap { position:relative; min-width:0; }
  .viwrap::before { content:''; position:absolute; left:-24px; top:6px; bottom:6px; width:1px; background:var(--border); transition:background .18s var(--ease); }
  .viwrap:focus-within::before, .row.dirty .viwrap::before { background:var(--accent); }
  /* Focus is shown by the gold hairline, not a box. */
  textarea, textarea:focus-visible { outline:none; }
  textarea { width:100%; background:transparent; border:0; color:var(--text); font:300 16px/1.9 Inter, sans-serif; resize:none; field-sizing:content; min-height:2em; padding:0; }
  textarea::placeholder { color:var(--subtle); font-style:italic; }
  .note { font-size:12px; color:var(--subtle); margin-top:8px; display:flex; gap:16px; flex-wrap:wrap; }
  .note .legacy { color:var(--accent); } .note .changed { color:var(--ssr-text); }
  .note button { transition:color .12s var(--ease); } .note button:hover { color:var(--text); }
  .note .grow { flex:1; }

  .context { border-left:1px solid var(--border); overflow:auto; padding:14px 16px; font-size:13px; }
  .context h3 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--subtle); font-weight:500; margin:16px 0 8px; }
  .context h3:first-child { margin-top:0; }
  .context img { width:100%; aspect-ratio:1; object-fit:contain; background:#0c0d0e; border-radius:6px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 10px; } .kv dt { color:var(--subtle); } .kv a { color:var(--text); }
  .mono { font-family:ui-monospace, 'Geist Mono', monospace; font-size:12px; color:var(--muted); }
  .hist li { list-style:none; padding:6px 0; border-bottom:1px solid var(--border); color:var(--muted); font-size:12px; }
  .savebar { flex:none; display:flex; align-items:center; gap:12px; padding:10px 20px; border-top:1px solid var(--border); background:var(--bg-surface); font-size:13px; }
  .savebar .n { color:var(--accent); } .savebar .grow { flex:1; color:var(--subtle); }
  .btn { padding:7px 14px; border-radius:6px; font-size:13px; font-weight:500; transition:transform .12s var(--ease); }
  .btn:active { transform:scale(.97); } .btn.primary { background:var(--accent); color:#111315; } .btn.ghost { border:1px solid var(--border); color:var(--muted); }
  kbd { font:11px ui-monospace, monospace; border:1px solid var(--border-strong); border-radius:4px; padding:0 4px; color:var(--muted); }

  @media (max-width:1100px) { .panes { grid-template-columns:220px 1fr; } .context { display:none; } }
  @media (max-width:900px) { .index { padding:32px 16px 100px; } .index .lead { font-size:30px; } .entries { columns:1; } }
  @media (max-width:760px) {
    main { margin-left:0; height:auto; min-height:100vh; } .rail { display:none; }
    .rechead { flex-wrap:wrap; padding:10px 16px; } .tabs { margin-left:0; width:100%; overflow-x:auto; scrollbar-width:none; }
    .panes { display:block; }
    .units { position:sticky; top:0; z-index:3; background:var(--bg-main); display:flex; overflow-x:auto; border-right:0; border-bottom:1px solid var(--border); padding:6px 8px; scrollbar-width:none; }
    .units .grp { display:none; } .units button { flex:none; width:auto; border-left:0; border-bottom:2px solid transparent; padding:6px 10px; } .units .p { display:none; }
    .units button.on { border-bottom-color:var(--accent); }
    .edhead { display:none; } .row { grid-template-columns:1fr; padding:20px 16px 20px 26px; scroll-margin-top:52px; } .viwrap::before { left:-12px; }
    .savebar { position:fixed; left:0; right:0; bottom:0; padding:10px 16px; } .editor { padding-bottom:64px; } .savebar .grow, .savebar kbd { display:none; } .savebar .n { flex:1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<nav class="rail"><div class="logo">物</div><i class="on"></i><i></i><i></i><i></i></nav>
<main id="app"></main>
<script src="data.js"></script>
<script>
const { list, record: R } = window.KG;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]);
const rare = { 4:'SSR', 3:'SR', 2:'R' };
const DIRTY = new Set(['card_intro', `report.${R.structure.reports[1].fileId}.content`]);
const SIM_CHANGED = 'relic_intro';
const byKey = Object.fromEntries(R.units.map((u) => [u.key, u]));
const status = (u) => u.key === SIM_CHANGED ? 'changed' : u.origin === 'legacy_workbook' ? 'legacy' : u.vi ? 'done' : 'todo';
const dotColor = { changed:'#F0A08F', legacy:'#D4B763', done:'#7fb08a', todo:'#6B7280' };
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

function groups() {
  const g = [['Giới thiệu', [['card_intro', 'Đánh giá']]]];
  g.push(['Báo cáo', R.structure.reports.flatMap((r, i) => [[`report.${r.fileId}.title`, `Tiêu đề ${i + 1}`, r], [`report.${r.fileId}.content`, `Báo cáo ${i + 1}`, r]])]);
  g.push(['Hiện vật', [['relic_intro', 'Giới thiệu hiện vật']]]);
  g.push(['Dòng thời gian', R.structure.timeline.flatMap((s) => [[`timeline.${s}.label`, `Mốc ${s}`], [`timeline.${s}.story`, `Câu chuyện ${s}`]])]);
  return g.map(([name, items]) => [name, items.filter(([k]) => byKey[k])]);
}

function listView() {
  return `<div class="viewhead"><b>Khí Giả</b><span>Nhân vật · bản dịch tiếng Việt</span></div>
  <div class="scroll"><div class="index"><h1>Khí Giả</h1>
    <div class="lead">133 hồ sơ<small>Tiến độ dịch lore theo từng nhân vật. Bấm một tên để mở hồ sơ.</small></div>
    <div class="find"><input placeholder="Tìm tên hoặc mã" aria-label="Tìm nhân vật" /><button class="on">Tất cả</button><button>Chưa xong</button><button>Có bản cũ</button><button>Tiếng Trung đã đổi</button><button>Thuật ngữ lore</button></div>
    <div class="entries">${list.map((c) => { const p = c.progress || { total: 0, done: 0, legacy: 0 }; return `<button class="entry" onclick="location.hash='#record'">
      <img src="${esc(c.avatar)}" alt=""><div><div class="n">${esc(c.nameVi)}<small class="serif">${esc(c.nameCn)}</small></div><div class="id">${c.id} · ${rare[c.rare] || ''} · ${esc(c.dept)}</div></div>
      <div class="frac">${p.done} / ${p.total}${p.legacy ? `<small>${p.legacy} bản cũ</small>` : ''}</div></button>`; }).join('')}</div></div></div>`;
}

function recordView() {
  const t = R.terms;
  const items = groups().flatMap(([, it]) => it);
  const rows = items.map(([k, label, r]) => {
    const u = byKey[k]; const st = status(u);
    const unlock = r && k.endsWith('.title') && r.unlock.type === 2 ? `<span>Mở khoá: thiện cảm ${r.unlock.elementId} · <span class="serif">${esc(R.affinity[r.unlock.elementId] || '')}</span></span>` : '';
    const note = st === 'changed' ? '<span class="changed">Tiếng Trung đã đổi</span><button>So bản cũ</button>' : st === 'legacy' ? '<span class="legacy">Bản cũ · chưa lưu</span><button>Dùng bản này</button>' : st === 'todo' ? '<span>Chưa dịch</span>' : '';
    return `<div class="row ${DIRTY.has(k) ? 'dirty' : ''}" id="u-${k}" data-k="${k}"><div class="cap"><b>${label}</b>${unlock}</div>
      <div class="orig">${esc(u.cn)}</div>
      <div class="viwrap"><textarea aria-label="${label} — tiếng Việt" placeholder="Viết bản tiếng Việt…">${esc(u.vi || '')}</textarea>
      <div class="note">${note}<button>Chép nguồn</button><button>Phóng to</button><span class="grow"></span><span>${(u.vi || '').length} ký tự</span></div></div></div>`;
  }).join('');
  const nav = groups().map(([name, it]) => `<div class="grp">${name}</div>` + it.map(([k, label]) => `<button data-k="${k}"><span class="dot" style="background:${dotColor[status(byKey[k])]}"></span><span><div class="t">${label}</div><div class="p serif">${esc(byKey[k].cn.slice(0, 24))}</div></span></button>`).join('')).join('');
  return `<div class="viewhead"><span class="crumb"><a href="#list">Khí Giả</a> / ${R.id}</span></div>
  <div class="rechead"><img src="${esc(R.avatar)}" alt=""><h1>${esc(R.nameVi)}<small class="serif">${esc(R.nameCn)}</small></h1>
    <nav class="tabs"><button>Tổng quan</button><button class="on">Lore</button><button>Trang phục</button><button>Nguồn</button><button>Lịch sử</button></nav></div>
  <div class="panes"><aside class="units" aria-label="Các đoạn lore">${nav}</aside>
    <section class="editor"><div class="edhead"><div>Nguyên bản</div><div>Tiếng Việt</div></div>${rows}</section>
    <aside class="context"><h3>Hiện vật</h3><img src="${esc(R.archive.image)}" alt="">
      <dl class="kv" style="margin-top:10px"><dt>Loại</dt><dd><a href="#">${esc(t.type?.cn)}</a></dd><dt>Triều đại</dt><dd><a href="#">${esc(t.era?.cn)}</a></dd><dt>Bảo tàng</dt><dd><a href="#">${esc(t.museum?.cn)}</a></dd><dt>Trực thuộc</dt><dd>${esc(R.dept)}</dd></dl>
      <h3>Tiến độ</h3><div class="mono">0/14 đã lưu · 10 bản cũ · 4 chưa dịch</div>
      <h3>Lịch sử gần đây</h3><ul class="hist"><li>Import dữ liệu nguồn · 24/9</li><li>Nạp 10 bản cũ từ workbook · 24/9</li></ul></aside></div>
  <div class="savebar"><span class="n"></span><span class="grow">Tự xuất bản 30 giây sau khi lưu</span><kbd>Ctrl S</kbd><button class="btn ghost">Bỏ thay đổi</button><button class="btn primary">Lưu</button></div>`;
}

// The unit list jumps to its row; focusing a row marks its unit active.
function setActive(k) {
  document.querySelectorAll('.row.on, .units button.on').forEach((el) => el.classList.remove('on'));
  document.getElementById(`u-${k}`)?.classList.add('on');
  const b = document.querySelector(`.units button[data-k="${CSS.escape(k)}"]`);
  if (!b) return;
  b.classList.add('on');
  // Scroll only the unit list (scrollIntoView would cancel the page's smooth jump).
  const s = b.parentElement;
  if (s.scrollWidth > s.clientWidth) s.scrollLeft = b.offsetLeft - (s.clientWidth - b.offsetWidth) / 2;
  else if (b.offsetTop < s.scrollTop || b.offsetTop + b.offsetHeight > s.scrollTop + s.clientHeight) s.scrollTop = b.offsetTop - s.clientHeight / 3;
}
function countDirty() { const n = document.querySelector('.savebar .n'); if (n) n.textContent = `${document.querySelectorAll('.row.dirty').length} thay đổi chưa lưu`; }

function render() {
  document.getElementById('app').innerHTML = location.hash === '#list' ? listView() : recordView();
  const units = document.querySelector('.units');
  if (!units) return;
  units.addEventListener('click', (e) => {
    const k = e.target.closest('button[data-k]')?.dataset.k; if (!k) return;
    const row = document.getElementById(`u-${k}`);
    row.scrollIntoView({ behavior:smooth(), block:'start' });
    row.querySelector('textarea').focus({ preventScroll:true });
    setActive(k);
  });
  document.querySelector('.editor').addEventListener('focusin', (e) => { const k = e.target.closest('.row')?.dataset.k; if (k) setActive(k); });
  document.querySelector('.editor').addEventListener('input', (e) => { e.target.closest('.row')?.classList.add('dirty'); countDirty(); });
  setActive(`report.${R.structure.reports[1].fileId}.content`);
  countDirty();
}
addEventListener('hashchange', render); render();
</script>
</body>
</html>
