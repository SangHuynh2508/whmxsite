<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khí Giả — B · Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
<!--
  Direction B — Translation workbench (reference: Crowdin online editor, Side-by-Side mode,
  support.crowdin.com/online-editor). String list with status icons + source | translation grid +
  context panel. Assumptions: editors translate many units per session, so density, keyboard flow
  and status scanning matter more than art. Data real (A0144); the "đã đổi" state and 2 dirty rows
  are simulated to show every state.
-->
<style>
  :root {
    --bg-main:#111315; --bg-surface:#17191C; --bg-hover:#22262B; --bg-elevated:#1C2024;
    --border:#2B2F34; --border-strong:#3D434A; --text:#E3E5E8; --muted:#9097A0; --subtle:#6B7280;
    --accent:#D4B763; --accent-light:#24221A; --input:#1C2024; --input-border:#34383D;
    --ssr-text:#F0A08F; --ssr-border:rgba(210,92,76,.55); --ease:cubic-bezier(0.2,0,0,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { overflow-x:hidden; }
  body { background:var(--bg-main); color:var(--text); font:14px/1.55 Inter, system-ui, sans-serif; }
  .serif { font-family:'Noto Serif SC', serif; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  .rail { position:fixed; inset:0 auto 0 0; width:60px; border-right:1px solid var(--border); background:var(--bg-surface); display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:14px; z-index:5; }
  .rail .logo { width:34px; height:34px; border:1px solid var(--accent); border-radius:6px; color:var(--accent); display:grid; place-items:center; font-family:'Noto Serif SC'; font-weight:600; }
  .rail i { width:22px; height:22px; border:1.5px solid var(--muted); border-radius:5px; opacity:.6; } .rail i.on { border-color:var(--accent); opacity:1; }
  main { margin-left:60px; height:100vh; display:flex; flex-direction:column; }
  .viewhead { height:48px; flex:none; display:flex; align-items:center; gap:14px; padding:0 20px; border-bottom:1px solid var(--border); }
  .viewhead b { font-weight:600; } .viewhead span { color:var(--subtle); font-size:13px; }
  .viewhead .crumb { color:var(--muted); font-size:13px; } .viewhead .crumb a { color:var(--muted); text-decoration:none; }

  /* ---------- List: dense table ---------- */
  .listwrap { padding:18px 20px; overflow:auto; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .input { background:var(--input); border:1px solid var(--input-border); border-radius:6px; color:var(--text); padding:7px 10px; font:inherit; width:260px; }
  .chip { padding:5px 10px; border:1px solid var(--border); border-radius:6px; color:var(--muted); font-size:13px; }
  .chip.on { border-color:var(--accent); color:var(--text); background:var(--accent-light); }
  .chip small { color:var(--subtle); margin-left:4px; }
  .grow { flex:1; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-weight:500; font-size:12px; color:var(--subtle); padding:8px 10px; border-bottom:1px solid var(--border); }
  td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:hover td { background:var(--bg-hover); cursor:pointer; }
  .who { display:flex; align-items:center; gap:10px; }
  .who img { width:32px; height:32px; border-radius:6px; object-fit:cover; background:var(--bg-elevated); }
  .who .cn { color:var(--subtle); font-size:12px; }
  .mono { font-family:ui-monospace, 'Geist Mono', monospace; font-size:12px; color:var(--muted); }
  .bar { width:140px; height:6px; border-radius:3px; background:var(--bg-elevated); overflow:hidden; display:inline-flex; vertical-align:middle; margin-right:8px; }
  .bar i { background:var(--accent); } .bar i.legacy { background:rgba(212,183,99,.35); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }

  /* ---------- Record: 3-pane workbench ---------- */
  .rechead { flex:none; display:flex; align-items:center; gap:14px; padding:10px 20px; border-bottom:1px solid var(--border); }
  .rechead img { width:36px; height:36px; border-radius:6px; object-fit:cover; }
  .rechead h1 { font-size:16px; font-weight:600; } .rechead h1 small { font-weight:400; color:var(--subtle); margin-left:6px; }
  .tabs { display:flex; gap:2px; margin-left:24px; }
  .tabs button { white-space:nowrap; padding:6px 12px; border-radius:6px; color:var(--muted); font-size:13px; transition:background .12s var(--ease), color .12s var(--ease); }
  .tabs button.on { background:var(--bg-elevated); color:var(--text); box-shadow:inset 0 -2px 0 var(--accent); }
  .panes { flex:1; min-height:0; display:grid; grid-template-columns:260px 1fr 280px; }
  .units { border-right:1px solid var(--border); overflow:auto; padding:10px 0; }
  .units .grp { font-size:11px; letter-spacing:.12em; color:var(--subtle); padding:12px 16px 6px; text-transform:uppercase; }
  .units button { display:flex; gap:8px; align-items:flex-start; width:100%; text-align:left; padding:7px 16px; border-left:2px solid transparent; }
  .units button:hover { background:var(--bg-hover); }
  .units button.on { background:var(--accent-light); border-left-color:var(--accent); }
  .units .t { font-size:13px; } .units .p { font-size:12px; color:var(--subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:190px; }
  .editor { overflow:auto; }
  .edhead { position:sticky; top:0; z-index:2; display:grid; grid-template-columns:1fr 1fr; background:var(--bg-surface); border-bottom:1px solid var(--border); font-size:12px; color:var(--subtle); }
  .edhead div { padding:8px 16px; } .edhead div + div { border-left:1px solid var(--border); }
  .row { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--border); }
  .row.on { background:rgba(212,183,99,.04); box-shadow:inset 2px 0 0 var(--accent); }
  .cell { padding:12px 16px; min-width:0; }
  .cell + .cell { border-left:1px solid var(--border); }
  .rowtag { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--subtle); margin-bottom:6px; flex-wrap:wrap; }
  .src { font-family:'Noto Serif SC', serif; color:var(--muted); line-height:1.85; white-space:pre-line; }
  textarea { width:100%; background:var(--input); border:1px solid var(--input-border); border-radius:6px; color:var(--text); padding:8px 10px; font:14px/1.65 Inter, sans-serif; resize:vertical; field-sizing:content; min-height:4.5em; transition:border-color .12s var(--ease); }
  textarea:focus { outline:none; border-color:var(--accent); }
  .row.dirty textarea { border-color:rgba(212,183,99,.6); }
  .tag { font-size:11px; padding:1px 7px; border-radius:4px; background:var(--bg-elevated); color:var(--muted); }
  .tag.legacy { background:var(--accent-light); color:var(--accent); }
  .tag.changed { background:rgba(145,55,45,.35); color:var(--ssr-text); }
  .cellbar { display:flex; gap:12px; margin-top:6px; font-size:12px; color:var(--subtle); }
  .cellbar button:hover { color:var(--text); }
  .context { border-left:1px solid var(--border); overflow:auto; padding:14px 16px; font-size:13px; }
  .context h3 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--subtle); font-weight:500; margin:16px 0 8px; }
  .context h3:first-child { margin-top:0; }
  .context img { width:100%; aspect-ratio:1; object-fit:contain; background:#0c0d0e; border-radius:6px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 10px; } .kv dt { color:var(--subtle); } .kv a { color:var(--text); }
  .hist li { list-style:none; padding:6px 0; border-bottom:1px solid var(--border); color:var(--muted); font-size:12px; }
  .savebar { flex:none; display:flex; align-items:center; gap:12px; padding:10px 20px; border-top:1px solid var(--border); background:var(--bg-surface); font-size:13px; }
  .savebar .n { color:var(--accent); } .savebar .grow { color:var(--subtle); }
  .btn { padding:7px 14px; border-radius:6px; font-size:13px; font-weight:500; transition:transform .12s var(--ease); }
  .btn:active { transform:scale(.97); } .btn.primary { background:var(--accent); color:#111315; } .btn.ghost { border:1px solid var(--border); color:var(--muted); }
  kbd { font:11px ui-monospace, monospace; border:1px solid var(--border-strong); border-radius:4px; padding:0 4px; color:var(--muted); }
  @media (max-width:1100px) { .panes { grid-template-columns:220px 1fr; } .context { display:none; } }
  @media (max-width:760px) {
    main { margin-left:0; height:auto; min-height:100vh; } .rail { display:none; }
    .listwrap { padding:12px 16px; } .input { width:100%; } .bar { width:70px; }
    table .hide-sm { display:none; }
    .rechead { flex-wrap:wrap; padding:10px 16px; } .tabs { margin-left:0; width:100%; overflow-x:auto; scrollbar-width:none; }
    .panes { display:block; } .units { display:flex; overflow-x:auto; border-right:0; border-bottom:1px solid var(--border); padding:6px 8px; scrollbar-width:none; }
    .units .grp { display:none; } .units button { flex:none; width:auto; border-left:0; border-bottom:2px solid transparent; padding:6px 10px; } .units .p { display:none; }
    .units button.on { border-bottom-color:var(--accent); }
    .edhead { display:none; } .row { grid-template-columns:1fr; } .cell + .cell { border-left:0; padding-top:0; }
    .savebar { position:fixed; left:0; right:0; bottom:0; padding:10px 16px; } .editor { padding-bottom:64px; } .savebar .grow, .savebar kbd { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<nav class="rail"><div class="logo">物</div><i class="on"></i><i></i><i></i><i></i></nav>
<main id="app"></main>
<script src="data.js"></script>
<script>
const { list, record: R } = window.KG;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]);
const rare = { 4:'SSR', 3:'SR', 2:'R' };
const DIRTY = new Set(['card_intro', `report.${R.structure.reports[1].fileId}.content`]);
const SIM_CHANGED = 'relic_intro';
const ACTIVE = `report.${R.structure.reports[1].fileId}.content`;
const byKey = Object.fromEntries(R.units.map((u) => [u.key, u]));
const status = (u) => u.key === SIM_CHANGED ? 'changed' : u.origin === 'legacy_workbook' ? 'legacy' : u.vi ? 'done' : 'todo';
const dotColor = { changed:'#F0A08F', legacy:'#D4B763', done:'#7fb08a', todo:'#6B7280' };

function groups() {
  const g = [['Giới thiệu', [['card_intro', 'Đánh giá']]]];
  g.push(['Báo cáo', R.structure.reports.flatMap((r, i) => [[`report.${r.fileId}.title`, `Tiêu đề ${i + 1}`, r], [`report.${r.fileId}.content`, `Báo cáo ${i + 1}`, r]])]);
  g.push(['Hiện vật', [['relic_intro', 'Giới thiệu hiện vật']]]);
  g.push(['Dòng thời gian', R.structure.timeline.flatMap((s) => [[`timeline.${s}.label`, `Mốc ${s}`], [`timeline.${s}.story`, `Câu chuyện ${s}`]])]);
  return g.map(([name, items]) => [name, items.filter(([k]) => byKey[k])]);
}

function listView() {
  return `<div class="viewhead"><b>Khí Giả</b><span>Nhân vật · bản dịch tiếng Việt</span></div>
  <div class="listwrap"><div class="toolbar"><input class="input" placeholder="Tìm tên hoặc mã…" />
    <button class="chip on">Tất cả<small>133</small></button><button class="chip">Chưa dịch xong<small>133</small></button><button class="chip">Có bản cũ<small>15</small></button><button class="chip">Tiếng Trung đã đổi<small>0</small></button>
    <span class="grow"></span><button class="chip">Thuật ngữ lore →</button></div>
  <table><thead><tr><th>Nhân vật</th><th class="hide-sm">Mã</th><th class="hide-sm">Trực thuộc</th><th>Lore</th></tr></thead><tbody>
  ${list.map((c) => { const p = c.progress || { total: 0, done: 0, legacy: 0 }; const w = (n) => p.total ? (n / p.total) * 100 : 0; return `<tr onclick="location.hash='#record'">
    <td><div class="who"><img src="${esc(c.avatar)}" alt=""><div><div>${esc(c.nameVi)}</div><div class="cn serif">${esc(c.nameCn)}</div></div></div></td>
    <td class="mono hide-sm">${c.id}</td><td class="hide-sm" style="color:var(--muted)">${esc(c.dept)}</td>
    <td><span class="bar"><i style="width:${w(p.done)}%"></i><i class="legacy" style="width:${w(p.legacy)}%"></i></span><span class="mono">${p.done}/${p.total}</span>${p.legacy ? `<span class="tag legacy" style="margin-left:8px">${p.legacy} cũ</span>` : ''}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

function recordView() {
  const t = R.terms;
  const rows = groups().flatMap(([, items]) => items).map(([k, label, r]) => {
    const u = byKey[k]; const st = status(u); const dirty = DIRTY.has(k);
    const unlock = r && k.endsWith('.title') && r.unlock.type === 2 ? `<span>Mở khoá: thiện cảm ${r.unlock.elementId} · <span class="serif">${esc(R.affinity[r.unlock.elementId] || '')}</span></span>` : '';
    const tag = st === 'changed' ? '<span class="tag changed">Tiếng Trung đã đổi</span>' : st === 'legacy' ? '<span class="tag legacy">Bản cũ · chưa lưu</span>' : st === 'todo' ? '<span class="tag">Chưa dịch</span>' : '';
    return `<div class="row ${k === ACTIVE ? 'on' : ''} ${dirty ? 'dirty' : ''}">
      <div class="cell"><div class="rowtag"><b style="color:var(--muted);font-weight:500">${label}</b>${unlock}</div><div class="src">${esc(u.cn)}</div></div>
      <div class="cell"><div class="rowtag">${tag}</div><textarea placeholder="Dịch tiếng Việt…">${esc(u.vi || '')}</textarea>
      <div class="cellbar">${st === 'legacy' ? '<button>Dùng bản này</button>' : ''}${st === 'changed' ? '<button>So tiếng Trung cũ</button>' : ''}<button>Chép nguồn</button><button>Phóng to</button><span class="grow"></span><span>${(u.vi || '').length}</span></div></div></div>`;
  }).join('');
  const nav = groups().map(([name, items]) => `<div class="grp">${name}</div>` + items.map(([k, label]) => `<button class="${k === ACTIVE ? 'on' : ''}"><span class="dot" style="background:${dotColor[status(byKey[k])]}"></span><span><div class="t">${label}</div><div class="p serif">${esc(byKey[k].cn.slice(0, 24))}</div></span></button>`).join('')).join('');
  return `<div class="viewhead"><span class="crumb"><a href="#list">Khí Giả</a> / ${R.id}</span></div>
  <div class="rechead"><img src="${esc(R.avatar)}" alt=""><h1>${esc(R.nameVi)}<small class="serif">${esc(R.nameCn)}</small></h1>
    <nav class="tabs"><button>Tổng quan</button><button class="on">Lore</button><button>Trang phục</button><button>Nguồn</button><button>Lịch sử</button></nav></div>
  <div class="panes"><aside class="units">${nav}</aside>
    <section class="editor"><div class="edhead"><div>Tiếng Trung (nguồn)</div><div>Tiếng Việt</div></div>${rows}</section>
    <aside class="context"><h3>Hiện vật</h3><img src="${esc(R.archive.image)}" alt="">
      <dl class="kv" style="margin-top:10px"><dt>Loại</dt><dd><a href="#">${esc(t.type?.cn)}</a></dd><dt>Triều đại</dt><dd><a href="#">${esc(t.era?.cn)}</a></dd><dt>Bảo tàng</dt><dd><a href="#">${esc(t.museum?.cn)}</a></dd><dt>Trực thuộc</dt><dd>${esc(R.dept)}</dd></dl>
      <h3>Tiến độ</h3><div class="mono">0/14 đã lưu · 10 bản cũ · 4 chưa dịch</div>
      <h3>Lịch sử gần đây</h3><ul class="hist"><li>Import dữ liệu nguồn · 24/9</li><li>Nạp 10 bản cũ từ workbook · 24/9</li></ul></aside></div>
  <div class="savebar"><span class="n">2 thay đổi chưa lưu</span><span class="grow">Tự xuất bản 30 giây sau khi lưu</span><kbd>Ctrl S</kbd><button class="btn ghost">Bỏ thay đổi</button><button class="btn primary">Lưu</button></div>`;
}
const render = () => { document.getElementById('app').innerHTML = location.hash === '#list' ? listView() : recordView(); };
addEventListener('hashchange', render); render();
</script>
</body>
</html>
