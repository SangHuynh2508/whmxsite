<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../home/design-demos/common.css"><title>Tier List · D2</title>
<!-- D2 = D after the owner's notes (2026-10-02): fewer frames (groups are separated by space and one hairline, no boxes);
     the filters live behind ONE small icon at the top (like gll-fun's "Show filters"), opening a popover (bottom sheet
     ≤ 640 px); "Solo" → "Nhân vật"; the Đội hình / Thông tin tabs only exist when they have content (the tab bar
     disappears when only one tab is left). Big serif rank (A) + square portraits with the rarity glow (B). -->
<style>
:root{--scrim:rgb(0 0 0/.6)} /* tokens.css --scrim */
.wrap{max-width:1280px;margin:0 auto}
.mast h1{font:700 clamp(44px,7vw,88px)/1 var(--serif);letter-spacing:-.02em;padding-top:8px}
.by{margin-top:12px;font-size:14px;color:var(--ash)} .by b{color:var(--text);font-weight:500}
.demo{margin-top:4px;font-size:12px;color:var(--ash)}
.head{display:flex;align-items:flex-end;gap:16px;margin-top:20px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:24px}
.tabs button{all:unset;cursor:pointer;font:600 20px/1.4 var(--serif);color:var(--ash);padding-bottom:8px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--gold)}
.fbtn{all:unset;cursor:pointer;position:relative;margin:0 0 8px auto;display:grid;place-items:center;width:32px;height:32px;border-radius:6px;color:var(--ash);border:1px solid var(--line2)}
.fbtn:hover,.fbtn[aria-expanded=true]{color:var(--text);background:var(--hover)}
.fbtn.on{color:var(--gold);border-color:var(--goldline)}
.fbtn i{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--gold);color:var(--bg);font:600 11px/16px var(--sans);text-align:center;font-style:normal}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.active{margin-top:12px;font-size:13px;color:var(--ash)} .active b{color:var(--text);font-weight:500}
.active button{all:unset;cursor:pointer;margin-left:8px;color:var(--text);border-bottom:1px solid var(--gold)}
.legend{margin-top:12px;font-size:12px;color:var(--ash)}
.note{max-width:66ch;margin-top:16px;color:var(--ash);font-size:14px}
/* popover: lifted-slate, strong hairline, 6 px, "Đóng"; bottom sheet ≤ 640 px (DESIGN.md Popovers) */
dialog{margin:0;inset:auto;padding:16px 18px;width:min(360px,calc(100vw - 32px));background:var(--lifted);color:var(--text);border:1px solid var(--line2);border-radius:6px}
dialog::backdrop{background:var(--scrim)}
dialog h2{font:600 17px/1.3 var(--serif)}
dialog .k{margin:16px 0 8px;font-size:12px;color:var(--ash)}
dialog .chips{display:flex;flex-wrap:wrap;gap:6px}
dialog .chips button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);font:500 13px var(--sans);color:var(--ash)}
dialog .chips img{width:20px;height:20px;margin-left:-4px}
dialog .chips button[aria-pressed=true]{color:var(--text);border-color:var(--gold);background:var(--goldwash)}
dialog .foot{display:flex;justify-content:space-between;margin-top:20px}
dialog .foot button{all:unset;cursor:pointer;height:32px;padding:0 12px;border-radius:6px;font:500 14px/32px var(--sans);color:var(--ash)}
dialog .foot .close{background:var(--surface);border:1px solid var(--line2);color:var(--text)}
dialog[open]{animation:pop .3s cubic-bezier(.16,1,.3,1)} @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
/* tier groups: space + one hairline, no boxes */
.group{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.group:first-child{border-top:0;padding-top:8px;margin-top:24px}
.group>.desc{font:500 20px/1.4 var(--serif);max-width:52ch;margin-bottom:8px}
.row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;align-items:start;padding:16px 0}
.lab{display:flex;flex-direction:column;gap:4px}
.lab b{font:700 72px/.9 var(--serif);letter-spacing:-.03em}
.lab small{font-size:12px;color:var(--ash)}
.group.top .lab b{color:var(--gold)}
.tiles{display:flex;flex-wrap:wrap;gap:16px 12px}
.t{display:flex;flex-direction:column;gap:6px;width:96px}
.t .av{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--lifted);border:1px solid var(--line2);transition:border-color .2s}
.t:hover .av{border-color:var(--gold)}
.t .av img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.t:hover .av img{transform:scale(1.04)}
.t .gl{position:absolute;inset:auto 0 0 0;height:36%;background-size:100% 100%}
.t .bd{position:absolute;right:4px;bottom:4px;display:flex;gap:2px}
.t .bd span{font:600 11px/1 var(--sans);padding:3px 4px;border-radius:6px;background:var(--bg);border:1px solid var(--line2);color:var(--text)}
.t .bd .hc{color:var(--gold);border-color:var(--goldline)}
.t b{font:500 13px/1.3 var(--sans);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:48px 0;color:var(--ash)} .empty button{all:unset;cursor:pointer;color:var(--text);border-bottom:1px solid var(--gold)}
.team{padding:24px 0;border-top:1px solid var(--line)} .team:first-child{border-top:0}
.team h3{font:700 26px/1.2 var(--serif)} .team p{margin:6px 0 16px;color:var(--ash);font-size:14px;max-width:66ch}
.team.dim{opacity:.35}
.info{max-width:66ch;padding-top:24px;line-height:1.75}
.info p+p,.info ul,.info p+ul,.info ul+p{margin-top:16px} .info ul{padding-left:20px}
[data-panel]{animation:in .45s cubic-bezier(.16,1,.3,1)} @keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (max-width:640px){
 dialog{position:fixed;inset:auto 0 0 0;width:100%;max-width:none;max-height:85dvh;border-radius:6px 6px 0 0;border-bottom:0}
 dialog[open]{animation:sheet .42s cubic-bezier(.16,1,.3,1)} @keyframes sheet{from{transform:translateY(100%)}}
}
@media (max-width:768px){
 .tabs{gap:16px}.tabs button{font-size:17px}
 .group{margin-top:24px;padding-top:16px}
 .group>.desc{font-size:16px}
 .row{grid-template-columns:1fr;gap:8px;padding:12px 0}
 .lab{flex-direction:row;align-items:baseline;gap:8px}
 .lab b{font-size:44px}
 .tiles{gap:12px 8px}
 .t{width:calc((100% - 24px)/4)}
 .t b{font-size:12px}
 .team h3{font-size:20px}
}
@media (prefers-reduced-motion:reduce){[data-panel],dialog[open]{animation:none}}
</style></head><body>
<nav class="rail" aria-hidden="true"><b>物</b><i></i><i></i><i class="on"></i><i></i><i></i></nav><button class="fab" aria-label="Menu">☰</button>
<main class="main"><div class="wrap">
  <header class="mast">
    <h1>Tier List</h1>
    <p class="by" id="by"></p>
    <p class="demo">Bản thiết kế — vị trí xếp hạng, đội hình và lời mô tả là minh hoạ.</p>
    <div class="head">
      <div class="tabs" role="tablist" id="tabs"><button role="tab" data-tab="solo">Nhân vật</button><button role="tab" data-tab="teams">Đội hình</button><button role="tab" data-tab="info">Thông tin</button></div>
      <button type="button" class="fbtn" id="fbtn" aria-haspopup="dialog" aria-expanded="false" aria-label="Bộ lọc" title="Bộ lọc">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg><span id="fcount"></span></button>
    </div>
    <p class="active" id="active" hidden></p>
  </header>
  <section data-panel="solo"><p class="note" id="solo-note"></p><p class="legend">Z1–Z6 = mốc Trí Tri tối thiểu · HC = cần Hoán Chương · bấm Khí Giả để xem build</p><div id="solo"></div></section>
  <section data-panel="teams" hidden><p class="note" id="team-note"></p><div id="teams"></div></section>
  <section data-panel="info" hidden><div class="info" id="info"></div></section>
</div></main>
<dialog id="fdlg" aria-labelledby="fdlg-t"><h2 id="fdlg-t">Bộ lọc</h2><div id="fbody"></div>
  <div class="foot"><button type="button" onclick="clearFilter()">Xoá lọc</button><button type="button" class="close" onclick="fdlg.close()">Đóng</button></div></dialog>
<script src="tier-data.js"></script><script src="tier-common.js"></script>
<script>
// demo switches: ?teams=0 / ?info=0 empty those tabs to show they disappear
const q = new URLSearchParams(location.search);
if (q.get('teams') === '0') TL.teams.groups = [];
if (q.get('info') === '0') TL.info = '';

by.innerHTML = `Tham khảo tier list của <b>${esc(TL.author)}</b> · Cập nhật ${updated()}`;
document.getElementById('solo-note').textContent = TL.solo.note;
document.getElementById('team-note').textContent = TL.teams.note;
info.innerHTML = paragraphs(TL.info);

// a tab exists only when it has content; one tab left → no tab bar
const has = { solo: true, teams: TL.teams.groups.length > 0, info: TL.info.trim() !== '' };
document.querySelectorAll('[data-tab]').forEach((b) => { if (!has[b.dataset.tab]) b.remove(); });
if (document.querySelectorAll('[data-tab]').length < 2) tabs.style.visibility = 'hidden';

const tile = (e) => { const c = C(e.characterId); const b = badges(e);
  return `<a class="t" href="${href(e)}" title="${esc(tileLabel(e))}" aria-label="${esc(tileLabel(e))}"><span class="av"><img src="${c.avatar}" alt="" loading="lazy"><span class="gl" style="background-image:url(${glow(c.rare)})"></span>${b.length ? `<span class="bd">${b.map((x) => `<span class="${x === 'HC' ? 'hc' : ''}">${x}</span>`).join('')}</span>` : ''}</span><b>${esc(c.vi)}</b></a>`; };

// filter popover: anchored under the icon on wide screens, bottom sheet ≤ 640 px (CSS)
fbtn.addEventListener('click', () => {
  fdlg.showModal(); fbtn.setAttribute('aria-expanded', 'true');
  if (innerWidth > 640) { const r = fbtn.getBoundingClientRect(); fdlg.style.top = `${r.bottom + 8}px`; fdlg.style.left = `${Math.max(16, r.right - fdlg.offsetWidth)}px`; fdlg.style.position = 'fixed'; }
});
fdlg.addEventListener('close', () => fbtn.setAttribute('aria-expanded', 'false'));
fdlg.addEventListener('click', (e) => { if (e.target === fdlg) fdlg.close(); }); // click on the scrim

function renderFilter() {
  const chip = (kind, v, label, icon) => `<button type="button" aria-pressed="${filter[kind].has(v)}" onclick="toggle('${kind}',${v})">${icon ? `<img src="${icon}" alt="">` : ''}${label}</button>`;
  fbody.innerHTML = `<p class="k">Nghề</p><div class="chips">${Object.entries(JOBS).map(([n, l]) => chip('jobs', +n, l, jobIcon(n))).join('')}</div>`
    + `<p class="k">Độ hiếm</p><div class="chips">${presentRares().map((r) => chip('rares', r, RARE[r])).join('')}</div>`;
  const n = filter.jobs.size + filter.rares.size;
  fbtn.classList.toggle('on', n > 0);
  fcount.innerHTML = n ? `<i>${n}</i>` : '';
  const names = [...[...filter.jobs].map((j) => JOBS[j]), ...[...filter.rares].map((r) => RARE[r])];
  active.hidden = !n;
  active.innerHTML = n ? `Đang lọc: <b>${names.join(', ')}</b><button type="button" onclick="clearFilter()">Xoá lọc</button>` : '';
}
function renderSolo() {
  let first = true;
  solo.innerHTML = groups(TL.solo.tiers).map((g) => {
    const rows = g.tiers.map((t) => { const es = t.entries.filter(match); if (!es.length) return '';
      return `<div class="row"><div class="lab"><b>${esc(t.label)}</b><small>${es.length} Khí Giả</small></div><div class="tiles">${es.map(tile).join('')}</div></div>`; }).join('');
    if (!rows) return '';
    const html = `<section class="group${first ? ' top' : ''}">${g.description ? `<p class="desc">${esc(g.description)}</p>` : ''}${rows}</section>`;
    first = false; return html;
  }).join('') || '<p class="empty">Không có Khí Giả nào khớp bộ lọc. <button type="button" onclick="clearFilter()">Xoá lọc</button></p>';
}
function renderTeams() {
  teams.innerHTML = TL.teams.groups.map((g) => `<article class="team${g.members.some(match) ? '' : ' dim'}"><h3>${esc(g.name)}</h3><p>${esc(g.note)}</p><div class="tiles">${g.members.map(tile).join('')}</div></article>`).join('');
}
const all = () => { renderFilter(); renderSolo(); renderTeams(); };
onFilter(all); all(); wireTabs();
</script></body></html>
