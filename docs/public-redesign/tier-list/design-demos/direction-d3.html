<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../home/design-demos/common.css"><title>Tier List · D3</title>
<!-- D3 = D2 + the dual-agent /impeccable critique (2026-10-02, 23/40) + owner: "sửa hết, thêm ô tìm tên, lọc chỉ cho
     nhân vật, không lọc team".
     - Sticky tool bar (search + filter icon + result line) under the tabs, only on the Nhân vật tab.
     - Name search (accent-insensitive, VI and CN), AND with job/rarity; chips show counts, zero-result chips disabled,
       chips update in place (focus kept); desktop popover is non-modal (no scrim, the list reflows visibly), phone
       bottom sheet keeps the scrim and shows "Còn N Khí Giả".
     - Real headings (tier = h2, team = h2), tabs with tabpanel + arrow keys; empty tabs and a one-tab bar removed.
     - Legend drawn with the badge chips, incl. "không nhãn" and "bên trái mạnh hơn"; every badge has a title.
     - Gold rank only on the list's first tier; names get 3 lines on phones; no hover zoom (gold border only);
       rarity chips use DESIGN.md's -vivid catalogue-filter style. Teams are not filtered. -->
<style>
:root{--scrim:rgb(0 0 0/.6);--ssr-vivid:#F0564B;--sr-vivid:#F2C14E;--r-vivid:#4FA3F7;--on-vivid:#111315} /* copies of tokens.css */
.wrap{max-width:1280px;margin:0 auto}
.mast h1{font:700 clamp(32px,6vw,72px)/1 var(--serif);letter-spacing:-.02em;padding-top:8px}
.by{margin-top:12px;font-size:14px;color:var(--ash)} .by b{color:var(--text);font-weight:500}
.demo{margin-top:4px;font-size:12px;color:var(--ash)}
.tabs{display:flex;gap:24px;margin-top:20px;border-bottom:1px solid var(--line)}
.tabs[hidden]{display:none}
.tabs button{all:unset;cursor:pointer;font:600 20px/1.4 var(--serif);color:var(--ash);padding-bottom:8px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* sticky tools: search + filter + result line */
.bar{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bar[hidden]{display:none}
.search{display:flex;align-items:center;gap:8px;flex:0 1 320px;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--lifted);color:var(--ash)}
.search:focus-within{border-color:var(--gold)}
.search input{all:unset;flex:1;min-width:0;font:400 14px var(--sans);color:var(--text)}
.search input::placeholder{color:var(--ash)}
.fwrap{position:relative}
.fbtn{all:unset;cursor:pointer;position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:6px;color:var(--ash);border:1px solid var(--line2)}
.fbtn:hover,.fbtn[aria-expanded=true]{color:var(--text);background:var(--hover)}
.fbtn.on{color:var(--gold);border-color:var(--goldline)}
.fbtn i{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--gold);color:var(--on-vivid);font:600 11px/16px var(--sans);text-align:center;font-style:normal}
.result{flex:1 1 220px;font-size:13px;color:var(--ash)} .result b{color:var(--text);font-weight:500}
.result button{all:unset;cursor:pointer;margin-left:8px;color:var(--text);border-bottom:1px solid var(--gold)}
/* filter: non-modal popover under the icon; bottom sheet with scrim ≤ 640 px */
dialog{margin:0;inset:auto;position:absolute;top:44px;right:0;z-index:5;padding:16px 18px;width:min(380px,calc(100vw - 32px));background:var(--lifted);color:var(--text);border:1px solid var(--line2);border-radius:6px}
dialog::backdrop{background:var(--scrim)}
dialog h2{font:600 17px/1.3 var(--serif)}
dialog .k{margin:16px 0 8px;font-size:12px;color:var(--ash)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);font:500 13px var(--sans);color:var(--ash)}
.chip img{width:20px;height:20px;margin-left:-4px}
.chip small{font-size:12px;color:var(--ash)}
.chip[aria-pressed=true]{color:var(--text);border-color:var(--gold);background:var(--goldwash)}
.chip:disabled{opacity:.4;cursor:default}
.chip.r4{color:var(--ssr-vivid)}.chip.r3{color:var(--sr-vivid)}.chip.r2{color:var(--r-vivid)}
.chip.r4[aria-pressed=true]{background:var(--ssr-vivid)}.chip.r3[aria-pressed=true]{background:var(--sr-vivid)}.chip.r2[aria-pressed=true]{background:var(--r-vivid)}
.chip.rr[aria-pressed=true]{color:var(--on-vivid);border-color:transparent}.chip.rr[aria-pressed=true] small{color:var(--on-vivid)}
dialog .legend{margin-top:16px}
dialog .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
dialog .foot span{font-size:13px;color:var(--ash);margin-right:auto}
dialog .foot button{all:unset;cursor:pointer;height:32px;padding:0 12px;border-radius:6px;font:500 14px/32px var(--sans);color:var(--ash)}
dialog .foot .close{background:var(--surface);border:1px solid var(--line2);color:var(--text)}
dialog[open]{animation:pop .3s cubic-bezier(.16,1,.3,1)} @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
/* legend drawn with the badges themselves */
.legend{font-size:13px;line-height:1.9;color:var(--ash)}
.bdg{display:inline-block;font:600 11px/1 var(--sans);padding:3px 4px;border-radius:6px;background:var(--bg);border:1px solid var(--line2);color:var(--text);vertical-align:1px}
.bdg.hc{color:var(--gold);border-color:var(--goldline)}
.note{max-width:66ch;margin-top:16px;color:var(--ash);font-size:14px}
[role=tabpanel]>.legend{margin-top:8px}
/* tier groups: space + one hairline */
.group{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.group:first-child{border-top:0;padding-top:8px;margin-top:16px}
.group>.desc{font:500 20px/1.4 var(--serif);max-width:52ch;margin-bottom:8px}
.row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;align-items:start;padding:16px 0}
.lab{display:flex;flex-direction:column;gap:4px}
.lab h2{font:700 72px/.9 var(--serif);letter-spacing:-.03em;margin:0}
.lab small{font-size:12px;color:var(--ash)}
.lab.top h2{color:var(--gold)}
.tiles{display:flex;flex-wrap:wrap;gap:16px 12px}
.t{display:flex;flex-direction:column;gap:6px;width:96px}
.t .av{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--lifted);border:1px solid var(--line2);transition:border-color .2s}
.t:hover .av{border-color:var(--gold)}
.t .av img{width:100%;height:100%;object-fit:cover;display:block}
.t .gl{position:absolute;inset:auto 0 0 0;height:36%;background-size:100% 100%}
.t .bd{position:absolute;right:4px;bottom:4px;display:flex;gap:2px}
.t b{font:500 13px/1.3 var(--sans);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:48px 0;color:var(--ash)} .empty button{all:unset;cursor:pointer;color:var(--text);border-bottom:1px solid var(--gold)}
.team{padding:24px 0;border-top:1px solid var(--line)} .team:first-child{border-top:0}
.team h2{font:700 26px/1.2 var(--serif);margin:0} .team p{margin:6px 0 16px;color:var(--ash);font-size:14px;max-width:66ch}
.info{max-width:66ch;padding-top:24px;line-height:1.75}
.info p+p,.info ul,.info p+ul,.info ul+p{margin-top:16px} .info ul{padding-left:20px}
[role=tabpanel]{animation:in .45s cubic-bezier(.16,1,.3,1)} @keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (max-width:640px){
 dialog{position:fixed;inset:auto 0 0 0;width:100%;max-width:none;max-height:85dvh;overflow:auto;border-radius:6px 6px 0 0;border-bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
 dialog[open]{animation:sheet .42s cubic-bezier(.16,1,.3,1)} @keyframes sheet{from{transform:translateY(100%)}}
 .chip{height:44px;min-width:44px;justify-content:center}
}
@media (max-width:768px){
 .tabs{gap:16px}.tabs button{font-size:16px}
 .search{flex:1 1 200px}
 .result{flex-basis:100%}.result.idle{display:none}
 .group{margin-top:24px;padding-top:16px}
 .group>.desc{font-size:16px}
 .row{grid-template-columns:1fr;gap:8px;padding:12px 0}
 .lab{flex-direction:row;align-items:baseline;gap:8px}
 .lab h2{font-size:44px}
 .tiles{gap:12px 8px}
 .t{width:calc((100% - 24px)/4)}
 .t b{font-size:12px;-webkit-line-clamp:3}
 .team h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){[role=tabpanel],dialog[open]{animation:none}}
</style></head><body>
<nav class="rail" aria-hidden="true"><b>物</b><i></i><i></i><i class="on"></i><i></i><i></i></nav><button class="fab" aria-label="Menu">☰</button>
<main class="main"><div class="wrap">
  <header class="mast">
    <h1>Tier List</h1>
    <p class="by" id="by"></p>
    <p class="demo">Bản thiết kế — vị trí xếp hạng, đội hình và lời mô tả là minh hoạ.</p>
    <div class="tabs" role="tablist" id="tabs" aria-label="Nội dung tier list">
      <button role="tab" id="t-solo" aria-controls="p-solo" data-tab="solo">Nhân vật</button><button role="tab" id="t-teams" aria-controls="p-teams" data-tab="teams">Đội hình</button><button role="tab" id="t-info" aria-controls="p-info" data-tab="info">Thông tin</button>
    </div>
  </header>
  <div class="bar" id="bar">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Tìm Khí Giả" aria-label="Tìm Khí Giả theo tên" autocomplete="off"></label>
    <div class="fwrap">
      <button type="button" class="fbtn" id="fbtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="fdlg" aria-label="Bộ lọc" title="Bộ lọc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg><span id="fcount"></span></button>
      <dialog id="fdlg" aria-labelledby="fdlg-t"><h2 id="fdlg-t">Bộ lọc</h2>
        <p class="k">Nghề</p><div class="chips" id="cj"></div>
        <p class="k">Độ hiếm</p><div class="chips" id="cr"></div>
        <p class="legend" id="leg2"></p>
        <div class="foot"><span id="left" aria-live="polite"></span><button type="button" id="fclear">Xoá lọc</button><button type="button" class="close" id="fclose">Đóng</button></div>
      </dialog>
    </div>
    <p class="result" id="result" aria-live="polite"></p>
  </div>
  <section role="tabpanel" id="p-solo" aria-labelledby="t-solo"><p class="note" id="solo-note"></p><p class="legend" id="leg1"></p><div id="solo"></div></section>
  <section role="tabpanel" id="p-teams" aria-labelledby="t-teams" hidden><p class="note" id="team-note"></p><div id="teams"></div></section>
  <section role="tabpanel" id="p-info" aria-labelledby="t-info" hidden><div class="info" id="info"></div></section>
</div></main>
<script src="tier-data.js"></script><script src="tier-common.js"></script>
<script>
// demo switches: ?teams=0 / ?info=0 empty those tabs to show they disappear
const qs = new URLSearchParams(location.search);
if (qs.get('teams') === '0') TL.teams.groups = [];
if (qs.get('info') === '0') TL.info = '';

const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
const state = { jobs: new Set(), rares: new Set(), q: '' };
const all = TL.solo.tiers.flatMap((t) => t.entries);
const hit = (e, s = state) => { const c = C(e.characterId);
  return (!s.jobs.size || s.jobs.has(c.job)) && (!s.rares.size || s.rares.has(c.rare)) && (!s.q || fold(c.vi).includes(s.q) || c.cn.includes(s.q)); };
const count = (s) => all.filter((e) => hit(e, s)).length;

by.innerHTML = `Tham khảo tier list của <b>${esc(TL.author)}</b> · Cập nhật ${updated()}`;
document.getElementById('solo-note').textContent = TL.solo.note;
document.getElementById('team-note').textContent = TL.teams.note;
info.innerHTML = paragraphs(TL.info);
leg1.innerHTML = leg2.innerHTML = '<span class="bdg">Z3</span> mốc Trí Tri tối thiểu · <span class="bdg hc">HC</span> cần Hoán Chương · không nhãn = không cần mốc · trong một tier, bên trái mạnh hơn · bấm để xem build';

const badgeTitle = (e) => [e.zhizhi && `Trí Tri ${e.zhizhi}`, e.hc && 'cần Hoán Chương'].filter(Boolean).join(' · ');
const tile = (e) => { const c = C(e.characterId); const b = badges(e);
  return `<a class="t" href="${href(e)}" aria-label="${esc(tileLabel(e))}"><span class="av"><img src="${c.avatar}" alt="" loading="lazy"><span class="gl" style="background-image:url(${glow(c.rare)})"></span>${b.length ? `<span class="bd" title="${badgeTitle(e)}">${b.map((x) => `<span class="bdg${x === 'HC' ? ' hc' : ''}">${x}</span>`).join('')}</span>` : ''}</span><b>${esc(c.vi)}</b></a>`; };

// tabs: only those with content; one left → no tab bar; arrow keys move between tabs
const has = { solo: true, teams: TL.teams.groups.length > 0, info: TL.info.trim() !== '' };
for (const k of ['teams', 'info']) if (!has[k]) { document.getElementById(`t-${k}`).remove(); document.getElementById(`p-${k}`).remove(); }
const tabBtns = [...tabs.querySelectorAll('[role=tab]')];
tabs.hidden = tabBtns.length < 2;
function show(name, focus) {
  tabBtns.forEach((b) => { const on = b.dataset.tab === name; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; if (on && focus) b.focus(); });
  document.querySelectorAll('[role=tabpanel]').forEach((p) => { p.hidden = p.id !== `p-${name}`; });
  bar.hidden = name !== 'solo'; // search and filter only apply to the characters
}
tabBtns.forEach((b, i) => {
  b.addEventListener('click', () => show(b.dataset.tab));
  b.addEventListener('keydown', (ev) => { const d = { ArrowRight: 1, ArrowLeft: -1 }[ev.key]; if (d) show(tabBtns[(i + d + tabBtns.length) % tabBtns.length].dataset.tab, true); });
});

// chips are built once and updated in place (focus stays on the chip)
cj.innerHTML = Object.entries(JOBS).map(([n, l]) => `<button type="button" class="chip" data-k="jobs" data-v="${n}" aria-pressed="false"><img src="${jobIcon(n)}" alt="">${l} <small></small></button>`).join('');
cr.innerHTML = presentRares().map((r) => `<button type="button" class="chip rr r${r}" data-k="rares" data-v="${r}" aria-pressed="false">${RARE[r]} <small></small></button>`).join('');
fdlg.querySelectorAll('.chip').forEach((ch) => ch.addEventListener('click', () => { const s = state[ch.dataset.k], v = +ch.dataset.v; s.has(v) ? s.delete(v) : s.add(v); update(); }));
q.addEventListener('input', () => { state.q = fold(q.value); update(); });
const clearAll = () => { state.jobs.clear(); state.rares.clear(); state.q = ''; q.value = ''; update(); };
fclear.addEventListener("click", clearAll);

// filter: non-modal popover on wide screens (the list reflows in view), modal bottom sheet ≤ 640 px
const phone = () => matchMedia('(max-width:640px)').matches;
const open = () => { phone() ? fdlg.showModal() : fdlg.show(); fbtn.setAttribute('aria-expanded', 'true'); };
fbtn.addEventListener('click', () => (fdlg.open ? fdlg.close() : open()));
fclose.addEventListener('click', () => fdlg.close());
fdlg.addEventListener('close', () => { fbtn.setAttribute('aria-expanded', 'false'); fbtn.focus(); });
fdlg.addEventListener('click', (ev) => { if (ev.target === fdlg && phone()) fdlg.close(); }); // scrim
document.addEventListener('click', (ev) => { if (fdlg.open && !phone() && !ev.target.closest('.fwrap')) fdlg.close(); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && fdlg.open) fdlg.close(); });

function update() {
  fdlg.querySelectorAll('.chip').forEach((ch) => {
    const k = ch.dataset.k, v = +ch.dataset.v, on = state[k].has(v);
    const n = count({ ...state, [k]: new Set([v]) });
    ch.setAttribute('aria-pressed', on); ch.disabled = !on && n === 0; ch.querySelector('small').textContent = n;
  });
  const n = count(state), nf = state.jobs.size + state.rares.size;
  fbtn.classList.toggle('on', nf > 0);
  fcount.innerHTML = nf ? `<i>${nf}</i>` : '';
  left.textContent = `Còn ${n} Khí Giả`;
  const names = [...[...state.jobs].sort().map((j) => JOBS[j]), ...[...state.rares].sort((a, b) => b - a).map((r) => RARE[r])];
  const any = nf || state.q;
  result.classList.toggle('idle', !any);
  result.innerHTML = any ? `<b>${n}</b>/${all.length} Khí Giả${names.length ? ` · ${names.join(', ')}` : ''}${state.q ? ` · “${esc(q.value.trim())}”` : ''}<button type="button" onclick="clearAll()">Xoá lọc</button>` : `${all.length} Khí Giả`;
  const top = TL.solo.tiers[0];
  solo.innerHTML = groups(TL.solo.tiers).map((g) => {
    const rows = g.tiers.map((t) => { const es = t.entries.filter((e) => hit(e)); if (!es.length) return '';
      return `<div class="row"><div class="lab${t === top ? ' top' : ''}"><h2>${esc(t.label)}</h2><small>${es.length} Khí Giả</small></div><div class="tiles">${es.map(tile).join('')}</div></div>`; }).join('');
    return rows && `<section class="group">${g.description ? `<p class="desc">${esc(g.description)}</p>` : ''}${rows}</section>`;
  }).join('') || '<p class="empty">Không có Khí Giả nào khớp. <button type="button" onclick="clearAll()">Xoá lọc</button></p>';
}
if (has.teams) teams.innerHTML = TL.teams.groups.map((g) => `<article class="team"><h2>${esc(g.name)}</h2><p>${esc(g.note)}</p><div class="tiles">${g.members.map(tile).join('')}</div></article>`).join('');
update(); show('solo');
</script></body></html>
