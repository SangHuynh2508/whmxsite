<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,600;7..72,700&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../home/design-demos/common.css"><title>Tier List · B · Bảng tra</title>
<!-- B · Bảng tra (reference: Prydwen.gg tier list — a matrix of tiers × roles, verified 2026-10-02): here tiers × the
     five jobs, the game's job icons are the filter, tiles are square portraits with the game's rarity glow at the foot.
     One bordered sheet like the Build sheet: 1 px grid gaps are the dividers. Picking jobs drops their columns.
     ≤ 768 px every tier becomes a block with one line per job (job icon + tiles). Form from the content: players ask
     "who is top for MY job" — the job is a column, so the answer is one vertical glance. -->
<style>
:root{--r-text:#AFCDF1;--r-bg:rgba(78,112,145,.42)} /* tokens.css --rarity-r-text / --rarity-r mixed, like the SSR/SR pair in common.css */
.wrap{max-width:1360px;margin:0 auto}
h1{font:700 26px/1.25 var(--serif)}
.by{margin-top:4px;font-size:13px;color:var(--ash)} .by b{color:var(--text);font-weight:500}
.seg{display:inline-flex;gap:4px;margin:16px 0;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;font:500 13px var(--sans);color:var(--ash);border:1px solid transparent}
.seg button[aria-selected=true]{background:var(--lifted);color:var(--text);border-color:var(--line2)}
.seg button:focus-visible,.tool button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tool{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px 6px 0 0;border-bottom:0}
.tool .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tool .k{font-size:12px;color:var(--ash);margin-right:4px}
.jb{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 6px;border-radius:6px;border:1px solid var(--line2);font:500 13px var(--sans);color:var(--ash)}
.jb img{width:22px;height:22px}
.jb[aria-pressed=true]{color:var(--text);border-color:var(--gold);background:var(--lifted)}
.rb{all:unset;cursor:pointer;height:32px;padding:0 10px;border-radius:6px;font:600 12px/32px var(--sans);border:1px solid transparent}
.rb.r4{color:var(--ssr-text);background:var(--ssr-bg)}.rb.r3{color:var(--sr-text);background:var(--sr-bg)}.rb.r2{color:var(--r-text);background:var(--r-bg)}
.rb[aria-pressed=false]{background:transparent;border-color:var(--line2)}
.count{margin-left:auto;font-size:12px;color:var(--ash)} .count button{all:unset;cursor:pointer;margin-left:8px;color:var(--text);border-bottom:1px solid var(--gold)}
.key{padding:8px 16px;font-size:12px;color:var(--ash);background:var(--surface);border:1px solid var(--line);border-top:1px solid var(--line);}
.sheet{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;overflow:hidden}
.sheet>*{background:var(--surface)}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;font:600 13px var(--sans);background:var(--lifted)}
.hd img{width:24px;height:24px}
.corner{background:var(--lifted)}
.desc{grid-column:1/-1;padding:10px 16px;font:600 14px/1.4 var(--serif);color:var(--text);background:var(--bg)}
.lab{display:flex;align-items:flex-start;justify-content:center;padding:14px 4px;font:700 28px/1 var(--serif)}
.lab.top{color:var(--gold)}
.cell{display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px 8px;padding:12px;min-height:96px}
.cell .jh{display:none}
.t{display:flex;flex-direction:column;align-items:center;width:64px;text-align:center}
.t .av{position:relative;width:56px;height:56px;border-radius:6px;overflow:hidden;background:var(--lifted);border:1px solid var(--line2);transition:border-color .2s}
.t:hover .av{border-color:var(--gold)}
.t .av img{width:100%;height:100%;object-fit:cover;display:block}
.t .gl{position:absolute;inset:auto 0 0 0;height:40%;background-size:100% 100%}
.t .bd{position:absolute;right:2px;bottom:2px;display:flex;gap:2px}
.t .bd span{font:600 11px/1 var(--sans);padding:2px 3px;border-radius:6px;background:var(--bg);color:var(--text)}
.t .bd .hc{color:var(--gold)}
.t b{margin-top:4px;font:500 12px/1.3 var(--sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{margin:0 0 12px;font-size:14px;color:var(--ash);max-width:80ch}
.empty{padding:32px 16px;color:var(--ash);grid-column:1/-1}
.teams{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.team{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px;background:var(--surface)}
.team h3{font:700 18px/1.3 var(--serif)} .team p{margin-top:4px;font-size:13px;color:var(--ash)}
.team .row{display:flex;flex-wrap:wrap;gap:12px 8px}
.team.dim{opacity:.4}
.info{max-width:66ch;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:6px;line-height:1.75}
.info p+p,.info ul,.info p+ul,.info ul+p{margin-top:12px} .info ul{padding-left:20px}
[data-panel]{animation:in .4s cubic-bezier(.16,1,.3,1)} @keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (max-width:768px){
 .sheet{display:block;background:var(--surface)}
 .hd,.corner{display:none}
 .desc{border-top:1px solid var(--line)}
 .lab{justify-content:flex-start;padding:12px 16px 4px;border-top:1px solid var(--line);font-size:24px}
 .cell{min-height:0;padding:4px 16px 12px;align-items:flex-start}
 .cell:empty{display:none}
 .cell .jh{display:flex;align-items:center;width:100%;gap:6px;font-size:12px;color:var(--ash)} .cell .jh img{width:18px;height:18px}
 .tool .grp.jobs .jb span{display:none} .jb{padding:0 6px}
 .count{margin-left:0;width:100%}
 .team{grid-template-columns:1fr}
}
</style></head><body>
<nav class="rail" aria-hidden="true"><b>物</b><i></i><i></i><i class="on"></i><i></i><i></i></nav><button class="fab" aria-label="Menu">☰</button>
<main class="main"><div class="wrap">
  <h1>Tier List</h1>
  <p class="by" id="by"></p>
  <div class="seg" role="tablist"><button role="tab" data-tab="solo">Solo</button><button role="tab" data-tab="teams">Đội hình</button><button role="tab" data-tab="info">Thông tin</button></div>
  <section data-panel="solo"><p class="note" id="solo-note"></p><div class="tool" id="tool"></div><div class="key">Z1–Z6 = mốc Trí Tri tối thiểu · HC = cần Hoán Chương · bấm Khí Giả để xem build · <i>bản thiết kế: xếp hạng minh hoạ</i></div><div class="sheet" id="sheet"></div></section>
  <section data-panel="teams" hidden><p class="note" id="team-note"></p><div class="teams" id="teams"></div></section>
  <section data-panel="info" hidden><div class="info" id="info"></div></section>
</div></main>
<script src="tier-data.js"></script><script src="tier-common.js"></script>
<script>
by.innerHTML = `Tham khảo tier list của <b>${esc(TL.author)}</b> · Cập nhật ${updated()}`;
document.getElementById('solo-note').textContent = TL.solo.note;
document.getElementById('team-note').textContent = TL.teams.note;
info.innerHTML = paragraphs(TL.info);

const tile = (e) => { const c = C(e.characterId); const b = badges(e);
  return `<a class="t" href="${href(e)}" title="${esc(tileLabel(e))}" aria-label="${esc(tileLabel(e))}"><span class="av"><img src="${c.avatar}" alt="" loading="lazy"><span class="gl" style="background-image:url(${glow(c.rare)})"></span>${b.length ? `<span class="bd">${b.map((x) => `<span class="${x === 'HC' ? 'hc' : ''}">${x}</span>`).join('')}</span>` : ''}</span><b>${esc(c.vi)}</b></a>`; };

function render() {
  const jobs = Object.keys(JOBS).map(Number).filter((j) => !filter.jobs.size || filter.jobs.has(j));
  const all = TL.solo.tiers.flatMap((t) => t.entries); const shown = all.filter(match).length;
  tool.innerHTML = `<div class="grp jobs"><span class="k">Nghề</span>${Object.entries(JOBS).map(([n, l]) => `<button type="button" class="jb" aria-pressed="${filter.jobs.has(+n)}" aria-label="${l}" title="${l}" onclick="toggle('jobs',${n})"><img src="${jobIcon(n)}" alt=""><span>${l}</span></button>`).join('')}</div>`
    + `<div class="grp"><span class="k">Độ hiếm</span>${presentRares().map((r) => `<button type="button" class="rb r${r}" aria-pressed="${filter.rares.has(r)}" onclick="toggle('rares',${r})">${RARE[r]}</button>`).join('')}</div>`
    + `<span class="count">Đang hiện ${shown}/${all.length}${filter.jobs.size || filter.rares.size ? '<button type="button" onclick="clearFilter()">Xoá lọc</button>' : ''}</span>`;
  sheet.style.gridTemplateColumns = `72px repeat(${jobs.length},minmax(0,1fr))`;
  let first = true;
  const body = groups(TL.solo.tiers).map((g) => {
    const rows = g.tiers.map((t) => { const es = t.entries.filter(match); if (!es.length) return '';
      const r = `<div class="lab${first ? ' top' : ''}">${esc(t.label)}</div>` + jobs.map((j) => { const cell = es.filter((e) => C(e.characterId).job === j);
        return `<div class="cell">${cell.length ? `<span class="jh"><img src="${jobIcon(j)}" alt="">${JOBS[j]}</span>${cell.map(tile).join('')}` : ''}</div>`; }).join('');
      first = false; return r; }).join('');
    return rows && `${g.description ? `<div class="desc">${esc(g.description)}</div>` : ''}${rows}`;
  }).join('');
  sheet.innerHTML = `<div class="corner"></div>${jobs.map((j) => `<div class="hd"><img src="${jobIcon(j)}" alt="">${JOBS[j]}</div>`).join('')}`
    + (body || '<p class="empty">Không có Khí Giả nào khớp bộ lọc.</p>');
  teams.innerHTML = TL.teams.groups.map((g) => `<article class="team${g.members.some(match) ? '' : ' dim'}"><div><h3>${esc(g.name)}</h3><p>${esc(g.note)}</p></div><div class="row">${g.members.map(tile).join('')}</div></article>`).join('');
}
onFilter(render); render(); wireTabs();
</script></body></html>
