<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ Sơ Lưu Trữ — Hướng C · Tập hồ sơ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<!--
  Hướng C · "Tập hồ sơ" — logic: 最佳设计师. Nếu không giới hạn ngân sách: Pentagram (nhóm làm catalogue bảo tàng /
  sách biên tập) — tư duy "cuốn sách hiện vật": bìa hồ sơ + mục lục + chương.
  Form đến từ nội dung: chính game gọi các đoạn này là 档案 (hồ sơ) với 档案编号 — nên đầu trang là "bìa hồ sơ"
  có mã lưu trữ kiểu đóng dấu; các báo cáo là CHƯƠNG, mở hết (đọc liền như sách), số chương lớn ở lề;
  mục lục dính bên trái để nhảy nhanh (thay cho việc gập báo cáo).
  Hiệu ứng chữ chạy: chỉ tiêu đề. Màu: token dark.
-->
<style>
:root{--bg-main:#111315;--bg-surface:#17191C;--bg-surface-hover:#22262B;--bg-elevated:#1C2024;--border-color:#2B2F34;--border-strong:#3D434A;--text-main:#E3E5E8;--text-muted:#9097A0;--text-subtle:#6B7280;--accent:#D4B763;--accent-light:#24221A;--border-gold-subtle:rgba(212,183,99,.30);--border-gold-divider:rgba(212,183,99,.16);--font-sans:'Inter',system-ui,sans-serif;--font-serif:'Noto Serif SC',serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg-main);color:var(--text-main);font:15px/1.8 var(--font-sans);-webkit-font-smoothing:antialiased}
.cover{max-width:1080px;margin:32px auto 0;padding:0 16px}
.cover-inner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:28px 28px 24px;background:var(--bg-surface);border:1px solid var(--border-gold-subtle);border-radius:10px;position:relative}
.cover-inner::before{content:"";position:absolute;inset:6px;border:1px solid var(--border-gold-divider);border-radius:6px;pointer-events:none}
.cover .kicker{margin:0;font:600 12px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.cover h2{margin:10px 0 0;font:700 34px/1.15 var(--font-serif)}
.cover .mark{font:500 12px var(--font-sans);color:var(--accent);vertical-align:super;margin-left:6px}
.stamp{text-align:right;font-size:13px;color:var(--text-muted);line-height:1.7}
.stamp code{display:inline-block;margin-bottom:6px;padding:4px 10px;font:600 14px/1.4 ui-monospace,'SF Mono',Consolas,monospace;letter-spacing:.06em;color:var(--accent);border:1px solid var(--border-gold-subtle);border-radius:4px}
.stamp a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--border-gold-subtle)}
.layout{max-width:1080px;margin:0 auto;padding:32px 16px 96px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px}
.toc{position:sticky;top:24px;align-self:start;font-size:13px}
.toc p{margin:0 0 8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--text-subtle)}
.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--border-color)}
.toc a{display:block;padding:5px 0 5px 14px;margin-left:-1px;color:var(--text-muted);text-decoration:none;border-left:1px solid transparent}
.toc a:hover{color:var(--text-main);border-left-color:var(--accent)}
.chapter{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 20px;padding:28px 0;border-top:1px solid var(--border-color);scroll-margin-top:24px}
.chapter:first-child{border-top:0;padding-top:0}
.chapter .no{font:700 34px/1 var(--font-serif);color:var(--border-strong);text-align:right}
.chapter h3{margin:0 0 4px;font:700 20px/1.35 var(--font-serif)}
.chapter .sub{margin:0 0 14px;font-size:13px;color:var(--text-muted)}
.chapter .sub b{color:var(--accent);font-weight:600}
.prose{margin:0;max-width:66ch;white-space:pre-line;text-wrap:pretty}
.cn{font-family:var(--font-serif);font-weight:500}
.chip{display:inline-block;margin-left:8px;padding:0 8px;font:500 12px/20px var(--font-sans);color:var(--text-muted);border:1px solid var(--border-color);border-radius:999px;white-space:nowrap;vertical-align:1px}
.plate{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;margin:0}
.plate .img{display:grid;place-items:center;padding:16px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px}
.plate img{max-width:100%;max-height:300px;object-fit:contain}
.plate dl{margin:0}
.plate dl div{padding:8px 0;border-bottom:1px solid var(--border-color)}
.plate dt{font-size:12px;color:var(--text-muted)}
.plate dd{margin:0;font-weight:500}
.years{margin:0;padding:0;list-style:none}
.years li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:10px 0;border-bottom:1px dashed var(--border-color)}
.years li:last-child{border-bottom:0}
.years .when{font-family:var(--font-serif);font-weight:700;color:var(--accent)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;gap:16px}
  .toc{position:static}.toc ol{display:flex;gap:6px;flex-wrap:wrap;border:0}.toc a{border:1px solid var(--border-color);border-radius:6px;padding:4px 10px;margin:0}
  .cover-inner{grid-template-columns:1fr}.stamp{text-align:left}
  .chapter{grid-template-columns:1fr}.chapter .no{text-align:left;font-size:22px;margin-bottom:6px}
  .plate{grid-template-columns:1fr}.years li{grid-template-columns:1fr;gap:0}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="./a0024-data.js"></script>
<script>
const P = LORE.profile, R = P.relic_info;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unit = (vi, cn) => (vi && vi.trim()) ? esc(vi) : (cn && cn.trim()) ? `<span class="cn">${esc(cn)}</span><span class="chip">Chưa dịch</span>` : '';
const rep = P.reports.map((r, i) => ({ id: `r${i}`, no: r.kind === 'special' ? 'A' : String(i + 1).padStart(2, '0'), r }));
const chapters = [
  { id: 'eval', no: '§', title: 'Đánh giá nhân sự', body: `<p class="prose">${unit(P.eval_intro_vi, P.eval_intro)}</p>` },
  { id: 'relic', no: '§', title: 'Hiện vật', body: `<figure class="plate"><div class="img"><img src="${LORE.archive.image}" alt="Hiện vật"></div>
      <dl><div><dt>Loại</dt><dd>${unit(R.type.vi, R.type.cn)}</dd></div><div><dt>Niên đại</dt><dd>${unit(R.era.vi, R.era.cn)}</dd></div><div><dt>Nơi lưu giữ</dt><dd>${unit(R.museum.vi, R.museum.cn)}</dd></div></dl></figure>
      <p class="prose" style="margin-top:18px">${unit(R.intro_vi, R.intro)}</p>` },
  { id: 'years', no: '§', title: 'Dòng thời gian', body: `<ol class="years">${R.timeline.map((t) => `<li><span class="when">${unit(t.label_vi, t.label)}</span><span class="prose">${unit(t.story_vi, t.story)}</span></li>`).join('')}</ol>` },
  ...rep.map(({ id, no, r }) => ({ id, no, title: unit(r.title_vi, r.title),
    sub: r.unlock_name ? `Mở khoá ở cảm ứng <b>cấp ${r.unlock_level} · ${unit(r.unlock_name_vi, r.unlock_name)}</b>` : '',
    body: `<p class="prose">${unit(r.content_vi, r.content)}</p>` })),
];
document.getElementById('app').innerHTML = `
  <header class="cover"><div class="cover-inner">
    <div><p class="kicker">Hồ sơ Khí Giả · ${esc(LORE.name_vi)}</p><h2>Hồ Sơ Lưu Trữ<span class="mark">✦ chữ chạy</span></h2></div>
    <div class="stamp"><code>${esc(P.record_id)}</code><br>${esc(P.department)} · ${esc(P.entity_status)}<br><a href="#">Sửa trong Admin</a></div>
  </div></header>
  <div class="layout">
    <nav class="toc" aria-label="Mục lục hồ sơ"><p>Mục lục</p><ol>${chapters.map((c) => `<li><a href="#${c.id}">${c.no === '§' ? c.title : `${c.no} · ${c.title.replace(/<[^>]+>Chưa dịch<\/span>/, '')}`}</a></li>`).join('')}</ol></nav>
    <main>${chapters.map((c) => `<section class="chapter" id="${c.id}"><span class="no">${c.no}</span><div><h3>${c.title}</h3>${c.sub ? `<p class="sub">${c.sub}</p>` : ''}${c.body}</div></section>`).join('')}</main>
  </div>`;
</script>
</body>
</html>
