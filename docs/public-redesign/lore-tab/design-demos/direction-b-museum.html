<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ Sơ Lưu Trữ — Hướng B · Trang hiện vật bảo tàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<!--
  Hướng B · "Trang hiện vật bảo tàng" — logic:现实参照 (标杆迁移). Tham chiếu: trang hiện vật của bộ sưu tập bảo tàng
  (kiểu Rijksmuseum / The Met collection object page): hiện vật + thông số đứng yên một bên, phần đọc chạy bên kia.
  Form đến từ nội dung: mỗi Khí Giả CHÍNH LÀ một hiện vật bảo tàng có thật (本体) → trang nên giống phiếu hiện vật.
  Cột trái (sticky ở desktop): ảnh hiện vật lớn + thông số + nhân sự. Cột phải: giới thiệu làm "lead", nguồn gốc,
  dòng thời gian dạng thanh niên đại ngang, báo cáo dạng tab 1/2/3/4 (mỗi lúc đọc một báo cáo — đỡ dài trang).
  Hiệu ứng chữ chạy: chỉ tiêu đề. Màu: token dark.
-->
<style>
:root{--bg-main:#111315;--bg-surface:#17191C;--bg-surface-hover:#22262B;--bg-elevated:#1C2024;--border-color:#2B2F34;--border-strong:#3D434A;--text-main:#E3E5E8;--text-muted:#9097A0;--text-subtle:#6B7280;--accent:#D4B763;--accent-light:#24221A;--border-gold-subtle:rgba(212,183,99,.30);--border-gold-divider:rgba(212,183,99,.16);--font-sans:'Inter',system-ui,sans-serif;--font-serif:'Noto Serif SC',serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-main);color:var(--text-main);font:15px/1.75 var(--font-sans);-webkit-font-smoothing:antialiased}
.page{max-width:1180px;margin:0 auto;padding:32px 16px 96px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:48px;align-items:start}
.aside{position:sticky;top:24px;display:grid;gap:16px}
.plate{margin:0;aspect-ratio:1/1;display:grid;place-items:center;padding:28px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:12px}
.plate img{max-width:100%;max-height:100%;object-fit:contain}
.plate figcaption{justify-self:start;align-self:end;font-size:12px;color:var(--text-muted)}
.facts{margin:0;border-top:1px solid var(--border-gold-subtle)}
.facts div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 2px;border-bottom:1px solid var(--border-color)}
.facts dt{font-size:13px;color:var(--text-muted)}
.facts dd{margin:0;font-weight:500}
.eyebrow{margin:0 0 6px;font:600 12px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.head h2{margin:0;font:700 30px/1.2 var(--font-serif)}
.head .mark{font:500 12px var(--font-sans);color:var(--accent);vertical-align:super;margin-left:6px}
.edit-link{flex:none;margin-top:8px;font-size:13px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--border-gold-subtle)}
.lead{margin:20px 0 0;font:500 18px/1.8 var(--font-serif);white-space:pre-line;text-wrap:pretty;max-width:62ch}
.block{margin-top:40px}
.block h3{margin:0 0 12px;font:700 18px/1.3 var(--font-serif)}
.prose{margin:0;max-width:68ch;white-space:pre-line;text-wrap:pretty}
.cn{font-family:var(--font-serif);font-weight:500}
.chip{display:inline-block;margin-left:8px;padding:0 8px;font:500 12px/20px var(--font-sans);color:var(--text-muted);border:1px solid var(--border-color);border-radius:999px;white-space:nowrap;vertical-align:1px}
.eras{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;margin:0;padding:0;list-style:none}
.eras li{position:relative;padding:22px 18px 0 0}
.eras li::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:var(--border-gold-subtle)}
.eras li::after{content:"";position:absolute;left:0;top:2px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg-main)}
.eras .when{display:block;font-weight:600;margin-bottom:4px}
.eras .what{font-size:14px;color:var(--text-muted);white-space:pre-line}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-color);overflow-x:auto}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;color:var(--text-muted);font:500 14px var(--font-sans);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--text-main);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{padding-top:18px}
.unlock{display:inline-flex;gap:6px;align-items:center;margin-bottom:12px;padding:4px 10px;font-size:12px;color:var(--text-muted);background:var(--accent-light);border:1px solid var(--border-gold-divider);border-radius:6px}
.unlock b{color:var(--accent);font-weight:600}
@media (max-width:900px){
  .page{grid-template-columns:1fr;gap:28px}.aside{position:static}.plate{aspect-ratio:4/3}
  .eras{grid-auto-flow:row}.eras li{padding:0 0 16px 22px}.eras li::before{left:4px;right:auto;top:10px;bottom:0;width:1px;height:auto}.eras li::after{top:4px}
}
</style>
</head>
<body>
<main class="page" id="app"></main>
<script src="./a0024-data.js"></script>
<script>
const P = LORE.profile, R = P.relic_info;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unit = (vi, cn) => (vi && vi.trim()) ? esc(vi) : (cn && cn.trim()) ? `<span class="cn">${esc(cn)}</span><span class="chip">Chưa dịch</span>` : '';
const tabs = P.reports.map((r, i) => `<button role="tab" aria-selected="${i === 0}" data-i="${i}">${r.kind === 'special' ? 'Mật A' : `Báo cáo ${i + 1}`}</button>`).join('');
const panel = (i) => { const r = P.reports[i]; return `
  ${r.unlock_name ? `<div class="unlock">Mở khoá ở cảm ứng <b>cấp ${r.unlock_level} · ${unit(r.unlock_name_vi, r.unlock_name)}</b></div>` : ''}
  <p class="prose">${unit(r.content_vi, r.content)}</p>`; };
document.getElementById('app').innerHTML = `
  <aside class="aside">
    <figure class="plate"><img src="${LORE.archive.image}" alt="Hiện vật"></figure>
    <dl class="facts">
      <div><dt>Loại</dt><dd>${unit(R.type.vi, R.type.cn)}</dd></div>
      <div><dt>Niên đại</dt><dd>${unit(R.era.vi, R.era.cn)}</dd></div>
      <div><dt>Nơi lưu giữ</dt><dd>${unit(R.museum.vi, R.museum.cn)}</dd></div>
      <div><dt>Trực thuộc</dt><dd>${esc(P.department)}</dd></div>
      <div><dt>Tình trạng bản thể</dt><dd>${esc(P.entity_status)}</dd></div>
      <div><dt>Mã hồ sơ</dt><dd>${esc(P.record_id)}</dd></div>
    </dl>
  </aside>
  <article>
    <div class="head"><div><p class="eyebrow">${esc(LORE.name_vi)}</p><h2>Hồ Sơ Lưu Trữ<span class="mark">✦ chữ chạy</span></h2></div><a class="edit-link" href="#">Sửa trong Admin</a></div>
    <p class="lead">${unit(P.eval_intro_vi, P.eval_intro)}</p>
    <section class="block"><h3>Nguồn gốc</h3><p class="prose">${unit(R.intro_vi, R.intro)}</p></section>
    <section class="block"><h3>Dòng thời gian</h3><ol class="eras">${R.timeline.map((t) => `<li><span class="when">${unit(t.label_vi, t.label)}</span><span class="what">${unit(t.story_vi, t.story)}</span></li>`).join('')}</ol></section>
    <section class="block"><h3>Báo cáo đánh giá</h3><div class="tabs" role="tablist">${tabs}</div><div class="panel" role="tabpanel">${panel(0)}</div></section>
  </article>`;
document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  document.querySelector('.panel').innerHTML = panel(+b.dataset.i);
});
</script>
</body>
</html>
