<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../home/design-demos/common.css"><link rel="stylesheet" href="gallery-demo.css">
<title>Thư viện ảnh · A · Phòng chiếu</title>
<!-- A · Phòng chiếu (screening room) — roulette 56 → web style #17 Gallery Dark, read inside the Night Archive.
     (a) One still per row, as large as the column allows (max 1120 px), on night-ink with wide negative space. Under each
         still an EXIF-style caption line: name (serif) · where it comes from · how to get it, and on the right the exact
         size and a download link. The UI recedes; the stills carry the colour.
     (b) A toggle "Từng ảnh / Tờ liên ảnh" switches to a contact sheet (dense grid of thumbnails) for scanning a big set,
         and back. Picking a frame on the sheet opens it.
     (c) Tabs by kind (the site's selection ink); story adds the series row + version row (inner horizontal scroll on phones).
     (d) Viewer: the image alone on near-black, caption at the foot, ‹ › at the sides, Esc / ←/→ / swipe, gold "Tải PNG gốc". -->
<style>
.wrap{max-width:1120px;margin:0 auto}
.head{padding:8px 0 16px}
.head h1{font:700 32px/1.2 var(--serif)}
.head p{margin-top:8px;color:var(--ash);max-width:62ch}
.tools{position:sticky;top:0;z-index:4;margin:0 -24px;padding:12px 24px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.row1{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.mode{display:flex;gap:4px}
.list{display:flex;flex-direction:column;gap:56px;padding:32px 0 24px}
.still{margin:0}
.still button.img{display:block;width:100%;padding:0;border:0;background:var(--surface);cursor:zoom-in;border-radius:6px;overflow:hidden}
.still img{display:block;width:100%;height:auto}
.still.sq{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px;align-items:end}
.cap{display:flex;gap:16px;align-items:baseline;justify-content:space-between;margin-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.still.sq .cap{flex-direction:column;align-items:flex-start;border:0;margin:0}
.cap b{font:600 16px/1.35 var(--serif)}
.cap .m{margin-top:2px;font-size:13px;color:var(--ash)}
.cap .poem{margin-top:12px;font:500 15px/1.75 var(--serif);color:var(--text)}
.exif{display:flex;gap:12px;align-items:center;flex:none;font-size:12px;color:var(--ash);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.exif a{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:6px;color:var(--text)}
.exif a:hover{background:var(--hover)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:24px 0}
.sheet button{position:relative;padding:0;border:0;background:var(--surface);border-radius:6px;overflow:hidden;cursor:zoom-in;aspect-ratio:21/9}
.sheet button.sq{aspect-ratio:1}
.sheet img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.sheet button:hover img{opacity:.82}
.sheet button span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12px;text-align:left;color:var(--text);background:linear-gradient(transparent,rgba(17,19,21,.85));opacity:0;transition:opacity .2s}
.sheet button:hover span,.sheet button:focus-visible span{opacity:1}
/* viewer */
.vw{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg)}
.vw[hidden]{display:none}
.vw .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}
.vw .stage{position:relative;display:grid;place-items:center;padding:0 72px;min-height:0}
.vw .stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.vw .nav{position:absolute;top:50%;transform:translateY(-50%)}
.vw .nav.p{left:16px}.vw .nav.n{right:16px}
.vw .foot{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding:16px 24px 24px;max-width:1280px;width:100%;margin:0 auto}
.vw .foot b{font:600 20px/1.3 var(--serif)}
.vw .foot .m{margin-top:4px;font-size:13px;color:var(--ash)}
.vw .foot .poem{margin-top:8px;font:500 15px/1.7 var(--serif)}
.vw .count{font-size:13px;color:var(--ash);font-variant-numeric:tabular-nums}
@media (max-width:768px){
  .tools{margin:0 -16px;padding:8px 16px}
  .head h1{font-size:26px}
  .list{gap:40px;padding-top:24px}
  .still.sq{grid-template-columns:1fr}
  .cap{flex-direction:column;gap:8px}
  .sheet{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet button span{opacity:1;font-size:12px}
  .vw .stage{padding:0 8px}
  .vw .nav{display:none}
  .vw .foot{flex-direction:column;align-items:stretch;padding:12px 16px 20px}
}
</style></head><body>
<nav class="rail" aria-label="Điều hướng"><b>物</b><i></i><i></i><i class="on"></i><i></i></nav>
<button class="fab" aria-label="Mở menu">☰</button>
<main class="main"><div class="wrap">
  <header class="head"><h1 id="t"></h1><p id="lede"></p></header>
  <div class="tools">
    <div class="row1"><div id="kinds" class="tabs" role="tablist"></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="search"><span id="sicon"></span><input id="q" type="search"></label>
        <div class="mode seg" role="group" aria-label="Cách xem"><button data-m="col">Từng ảnh</button><button data-m="sheet">Tờ liên ảnh</button></div></div></div>
    <div id="story"></div>
  </div>
  <div id="body"></div>
  <footer class="elsewhere" id="foot"></footer>
</div></main>
<div class="vw" id="vw" hidden role="dialog" aria-modal="true" aria-label="Xem ảnh">
  <div class="top"><span class="count" id="vc"></span><div style="display:flex;gap:8px"><a class="btn gold" id="vd" download></a><button class="btn icon" id="vx"></button></div></div>
  <div class="stage" id="vs"><button class="btn icon nav p" id="vp"></button><div class="vimg" id="vi"></div><button class="btn icon nav n" id="vn"></button></div>
  <div class="foot"><div id="vcap"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="gallery-data.js"></script><script src="gallery-common.js"></script><script src="gallery-ui.js"></script>
<script>
const { L, icon, esc } = G;
let mode = 'col';
const ui = GUI.mount({
  defaults: { kind: 'story', g: 'v3', v: G.subs('v3')[0] },
  render(list, st) {
    const body = document.getElementById('body');
    if (!list.length) return GUI.empty(body);
    if (mode === 'sheet') {
      body.innerHTML = `<div class="sheet">${list.map((it, i) => `<button data-i="${i}" class="${it.w === it.h ? 'sq' : ''}" aria-label="${esc(G.titleText(it))}"><img loading="lazy" src="${G.thumb(it)}" alt="" onerror="this.remove()"><span>${G.title(it)}</span></button>`).join('')}</div>`;
    } else {
      body.innerHTML = `<div class="list">${list.map((it, i) => `<figure class="still ${it.w === it.h ? 'sq' : ''}">
        <button class="img" data-i="${i}" aria-label="Xem to: ${esc(G.titleText(it))}"><img loading="lazy" src="${it.w === it.h ? G.thumb(it) : G.view(it)}" width="${it.w}" height="${it.h}" alt="" onerror="this.remove()"></button>
        <figcaption class="cap"><div><b>${G.title(it)}</b><div class="m">${GUI.meta(it)}</div>${it.kind === 'postcard' ? `<p class="poem">${G.note(it)}</p>` : ''}</div>
        <div class="exif"><span>${it.w} × ${it.h} · PNG</span><a href="${G.orig(it)}" download>${icon('down', 16)}Tải</a></div></figcaption></figure>`).join('')}</div>`;
    }
    GUI.arrive(body.querySelectorAll(mode === 'sheet' ? '.sheet button' : '.still'));
  },
  viewer: {
    show(it, i, n) {
      document.getElementById('vc').textContent = `${i + 1} / ${n}`;
      document.getElementById('vcap').innerHTML = `<b>${G.title(it)}</b><div class="m">${GUI.meta(it)} · ${it.w} × ${it.h}</div>${it.kind === 'postcard' ? `<p class="poem">${G.note(it)}</p>` : ''}`;
    },
  },
});
document.querySelectorAll('.mode button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.m; GUI.seg(document.querySelector('.mode'), mode, 'm'); ui.refresh(); }));
GUI.seg(document.querySelector('.mode'), mode, 'm');
</script></body></html>
