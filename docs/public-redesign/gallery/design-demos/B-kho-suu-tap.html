<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../home/design-demos/common.css"><link rel="stylesheet" href="gallery-demo.css">
<title>Thư viện ảnh · B · Kho sưu tập</title>
<!-- B · Kho sưu tập (collection) — reference: Rijksmuseum Collection Online (Fabrique × Q42, European Design Award gold
     2025, "image first"). Read inside the Night Archive.
     (a) Search first: a wide search field under the title, the result count beside the facets ("13 ảnh").
     (b) Facets as compact selects (Nhóm ▾ / Bản ▾) for story CGs — the version list is long (11 + 6 + 32 + 7 + 24), a
         select holds it on a phone without a scrolling strip. Kind stays as tabs: it is the page's first question.
     (c) Image-first grid at the art's true ratio (3 columns of 21 : 9, 5 of the square postcards), a museum label under
         each image: title (serif) + one ash line (source / version / how to get it).
     (d) Object view instead of a lightbox: the image fills the left, the facts sit in a column on the right (kind, name,
         poem, dl of facts) with the gold "Tải PNG gốc" first and ‹ › at the foot. Phones: image on top, facts under. -->
<style>
.wrap{max-width:1320px;margin:0 auto}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:24px;align-items:end;padding:8px 0 24px}
.head h1{font:700 40px/1.1 var(--serif)}
.head p{margin-top:8px;color:var(--ash);max-width:56ch}
.head .search{width:100%;height:44px}
.head .search input{font-size:15px}
.facets{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facets .seg button{height:36px;font-size:15px}
.facets .seg .ink{height:36px}
.fs{display:flex;gap:8px;align-items:center}
.sel{position:relative;display:inline-flex;align-items:center;height:36px;border:1px solid var(--line2);border-radius:6px;background:var(--surface)}
.sel span{padding-left:12px;font-size:13px;color:var(--ash);white-space:nowrap}
.sel select{appearance:none;height:34px;padding:0 32px 0 6px;border:0;background:none;color:var(--text);font:500 14px var(--sans);cursor:pointer;max-width:220px}
.sel select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sel svg{position:absolute;right:10px;pointer-events:none;color:var(--ash)}
.sel option{background:var(--lifted)}
.result{margin-left:auto;font-size:13px;color:var(--ash);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 20px;padding:24px 0}
.grid.sq{grid-template-columns:repeat(5,minmax(0,1fr))}
.obj{display:flex;flex-direction:column;gap:10px;padding:0;border:0;background:none;text-align:left;cursor:pointer;min-width:0}
.obj .im{display:block;width:100%;aspect-ratio:var(--r);border-radius:6px;overflow:hidden;background:var(--surface)}
.obj img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.obj:hover img{transform:scale(1.025)}
.obj b{display:block;font:600 15px/1.35 var(--serif)}
.obj small{display:block;margin-top:2px;font-size:13px;color:var(--ash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* object view */
.vw{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) 380px;background:var(--bg)}
.vw[hidden]{display:none}
.vw .stage{position:relative;display:grid;place-items:center;padding:24px;background:var(--bg);min-height:0}
.vw .side{display:flex;flex-direction:column;gap:20px;padding:20px 24px 24px;border-left:1px solid var(--line);background:var(--surface);overflow:auto}
.vw .top{display:flex;justify-content:space-between;align-items:center}
.vw .count{font-size:13px;color:var(--ash);font-variant-numeric:tabular-nums}
.vw .kind{font-size:13px;color:var(--ash)}
.vw h2{margin-top:4px;font:700 26px/1.25 var(--serif)}
.vw .poem{font:500 16px/1.8 var(--serif);padding:12px 0;border-top:1px solid var(--golddiv);border-bottom:1px solid var(--golddiv)}
.vw dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
.vw dt{color:var(--ash)}
.vw dd{margin:0}
.vw .dl{width:100%;height:44px;font-size:15px}
.vw .pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.sq{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:768px){
  .head{grid-template-columns:1fr;gap:16px;padding-bottom:16px}
  .head h1{font-size:28px}
  .facets .seg{width:100%}
  .fs{width:100%}.fs .sel{flex:1;min-width:0}.fs .sel select{max-width:none;width:100%}
  .result{margin-left:0}
  .grid{grid-template-columns:1fr;gap:24px}
  .grid.sq{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
  .vw{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);overflow:auto}
  .vw .stage{padding:56px 8px 12px;height:auto}
  .vw .side{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .vw .top{position:fixed;top:0;left:0;right:0;z-index:2;padding:8px 12px;background:rgba(17,19,21,.9)}
}
</style></head><body>
<nav class="rail" aria-label="Điều hướng"><b>物</b><i></i><i></i><i class="on"></i><i></i></nav>
<button class="fab" aria-label="Mở menu">☰</button>
<main class="main"><div class="wrap">
  <header class="head"><div><h1 id="t"></h1><p id="lede"></p></div><label class="search"><span id="sicon"></span><input id="q" type="search"></label></header>
  <div class="facets"><div id="kinds" role="tablist"></div><div class="fs" id="story"></div><span class="result" id="res" aria-live="polite"></span></div>
  <div id="body"></div>
  <footer class="elsewhere" id="foot"></footer>
</div></main>
<div class="vw" id="vw" hidden role="dialog" aria-modal="true" aria-label="Xem ảnh">
  <div class="stage" id="vs"><div class="vimg" id="vi"></div></div>
  <aside class="side">
    <div class="top"><span class="count" id="vc"></span><button class="btn icon ghost" id="vx"></button></div>
    <div id="vcap"></div>
    <a class="btn gold dl" id="vd" download></a>
    <div class="pn"><button class="btn" id="vp"></button><button class="btn" id="vn"></button></div>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="gallery-data.js"></script><script src="gallery-common.js"></script><script src="gallery-ui.js"></script>
<script>
const { L, icon, esc } = G;
const story = document.getElementById('story');
const ui = GUI.mount({
  defaults: { kind: 'story', g: 'v3', v: G.subs('v3')[0] },
  storyNav: false,
  render(list, st, set) {
    // facets: Nhóm ▾ / Bản ▾ (story only)
    if (st.kind === 'story') {
      const opt = (v, n, on) => `<option value="${esc(v)}"${on ? ' selected' : ''}>${n}</option>`;
      const strip = (h) => h.replace(/<[^>]+>/g, '').replace('(chưa dịch)', '');
      story.innerHTML = `<label class="sel"><span>Nhóm</span><select id="fg">${G.GROUPS.map(([g, n]) => opt(g, `${n} (${G.count((it) => it.group === g)})`, g === st.g)).join('')}</select>${icon('chev', 14)}</label>
        <label class="sel"><span>${/^v\d$/.test(st.g) ? 'Bản' : st.g === 'main' ? 'Chương' : 'Truyện'}</span><select id="fv">${opt('', L.all, !st.v)}${G.subs(st.g).map((s) => opt(s, strip(G.subLabel(st.g, s)), s === st.v)).join('')}</select>${icon('chev', 14)}</label>`;
      story.querySelector('#fg').onchange = (e) => set({ g: e.target.value, v: /^v\d$/.test(e.target.value) ? G.subs(e.target.value)[0] : '' });
      story.querySelector('#fv').onchange = (e) => set({ v: e.target.value });
    } else story.innerHTML = '';
    document.getElementById('res').textContent = `${list.length} ảnh`;
    const body = document.getElementById('body');
    if (!list.length) return GUI.empty(body);
    const sq = st.kind === 'postcard';
    body.innerHTML = `<div class="grid${sq ? ' sq' : ''}">${list.map((it, i) => `<button class="obj" data-i="${i}" style="--r:${it.w}/${it.h}">
      <span class="im"><img loading="lazy" src="${G.thumb(it)}" alt="" onerror="this.parentNode.innerHTML='<span class=ph>Không tải được ảnh</span>'"></span>
      <span><b>${G.title(it)}</b><small>${line(it)}</small></span></button>`).join('')}</div>`;
    GUI.arrive(body.querySelectorAll('.obj'));
  },
  viewer: {
    show(it, i, n) {
      document.getElementById('vc').textContent = `${i + 1} / ${n}`;
      const facts = [['Loại', G.KIND[it.kind]],
        it.kind === 'story' && ['Nằm trong', `${/^v\d$/.test(it.group) ? '' : G.GROUP[it.group] + ' · '}${G.subHtml(it)}`],
        it.kind === 'loading' && it.note_cn && ['Cách nhận', G.note(it)],
        ['Kích thước', `${it.w} × ${it.h} px`], ['Mã', `<span style="font-variant-numeric:tabular-nums">${esc(it.id)}</span>`]].filter(Boolean);
      document.getElementById('vcap').innerHTML = `<div class="kind">${G.KIND[it.kind]}</div><h2>${G.title(it)}</h2>
        ${it.kind === 'postcard' ? `<p class="poem" style="margin-top:16px">${G.note(it)}</p>` : ''}
        <dl style="margin-top:16px">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
    },
  },
});
// a museum label line: version / group for story CGs, how to get it for loading CGs
function line(it) {
  if (it.kind === 'story') return /^v\d$/.test(it.group) ? G.subHtml(it) : G.GROUP[it.group];
  if (it.kind === 'loading') return it.note_cn ? G.note(it) : G.KIND[it.kind];
  if (it.kind === 'postcard') return G.KIND[it.kind];
  return `${it.w} × ${it.h}`;
}
document.getElementById('vp').innerHTML = `${icon('left', 16)}<span>${L.prev}</span>`;
document.getElementById('vn').innerHTML = `<span>${L.next}</span>${icon('right', 16)}`;
</script></body></html>
