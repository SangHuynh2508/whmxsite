<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · hero fade + banner grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,600;7..72,700&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<!--
  v2 (owner 2026-09-30): the season theme = one big hero over the top of the page, fading into the page, text without a
  plate. Banners: 2 per row on desktop (≈4:1 slices) so the art fills the slice — no empty middle; logo above the name.
  Owner 2026-09-30 (v1): 3a (white text) is better; drop the grey box around the banner (sit on the page background); make it
  compact like s1n — a thin horizontal slice of the big art with the text on it, so 3–4 banners fit in one corner.
  Slice: PoolBg (scaled 1.12 to hide its tilted frame edges) + the UP skin drawing at ~3.3× the strip height, anchored
  at the top so the face is in the slice; title logo between the text and the face; dark fade on the text side only.
  Choice banner (cardPools kind "choiceness", 5003): no drawing — the game shows "?" tickets; we say "Tự chọn · N Khí Giả"
  from changeList (59 ids), not a guess.
-->
<style>
.home{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px 32px;align-items:start}
h2{font:600 16px var(--sans);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font:400 14px var(--sans);color:var(--ash)}
.list{display:flex;flex-direction:column;gap:8px}
.slice{position:relative;display:block;height:104px;border-radius:6px;overflow:hidden;isolation:isolate}
.slice .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;transform:scale(1.12);z-index:-2}
.slice .fig{position:absolute;right:-1%;top:-10%;height:340%;width:auto;z-index:-2}
.slice::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgb(0 0 0/.84) 0%,rgb(0 0 0/.74) 46%,rgb(0 0 0/.2) 70%,transparent 84%)}
.slice .txt{position:absolute;left:20px;top:0;bottom:0;max-width:52%;display:flex;flex-direction:column;justify-content:center;gap:2px;text-shadow:0 1px 3px rgb(0 0 0/.7)}
.slice .big{font:700 22px/1.25 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slice .meta{font:500 13px var(--sans);color:var(--text)}
.slice .meta b{font-weight:600}
.slice .logo{position:absolute;right:33%;top:50%;transform:translateY(-50%);max-height:78%;max-width:24%;object-fit:contain}
.slice:hover .big{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.slice.choice .logo{right:6%}
.slice.ended{filter:grayscale(.7)}
/* events in the same thin-row grammar, without art */
.ev{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:first-of-type{padding-top:0}
.ev .k{grid-column:1/-1;font-size:12px;color:var(--ash)}
.ev .n{font-size:16px}
.ev .l{font-size:14px;color:var(--ash);white-space:nowrap}.ev .l b{color:var(--text);font-weight:600}
.side{display:flex;flex-direction:column;gap:32px}
.rel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rel a{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.3}
.rel img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 12%;border-radius:6px;background:var(--lifted)}
.rel small{color:var(--ash);font-size:12px}
@media (max-width:980px){.home{grid-template-columns:1fr}}
@media (max-width:640px){
 .slice{height:96px}.slice .txt{left:14px;max-width:60%}.slice .big{font-size:18px}.slice .meta{font-size:12px}
 .slice .fig{right:-6%;height:330%}
 .slice .logo{right:8px;top:8px;transform:none;max-height:42%;max-width:30%}
 .slice::before{background:linear-gradient(90deg,rgb(0 0 0/.84) 0%,rgb(0 0 0/.74) 58%,rgb(0 0 0/.2) 85%,transparent 100%)}
}

.hero{position:relative;margin:-24px -24px 0;height:min(62vh,560px);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
.hero .ht{position:absolute;left:48px;bottom:56px;display:flex;flex-direction:column;gap:6px;text-shadow:0 2px 8px rgb(0 0 0/.85),0 0 2px rgb(0 0 0/.6)}
.hero .ver{font:600 15px var(--sans);color:var(--text)}
.hero h1{font:700 48px/1.1 var(--serif)}
.hero p{font:500 15px var(--sans)} .hero p b{font-weight:600}
.home{margin-top:-8px;position:relative}
.list.grid{display:grid;gap:12px}
.list.grid .slice{height:auto;aspect-ratio:4/1.1}
/* odd count: 2 + 3 (never an empty cell) */
.list.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.list.grid .slice{grid-column:span 3}
.list.grid.odd .slice:nth-last-child(-n+3){grid-column:span 2;aspect-ratio:3/1.1}
.list.grid.odd .slice:nth-last-child(-n+3) .big{font-size:19px}
.list.grid.odd .slice:nth-last-child(-n+3)::before{background:linear-gradient(90deg,rgb(0 0 0/.84) 0%,rgb(0 0 0/.74) 62%,rgb(0 0 0/.2) 84%,transparent 96%)}
.list.grid .slice .fig{height:250%;right:2%;top:-8%}
.list.grid .slice .logo{position:static;transform:none;max-height:40%;max-width:60%;object-position:left;align-self:flex-start}
.list.grid .slice .txt{max-width:62%;gap:4px}
.home.v2{grid-template-columns:1fr}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media (max-width:980px){.row2{grid-template-columns:1fr}}
@media (max-width:640px){.hero{margin:-16px -16px 0;height:440px}.hero .ht{left:16px;right:16px;bottom:40px}.hero h1{font-size:34px}
 .list.grid{grid-template-columns:1fr}.list.grid .slice,.list.grid.odd .slice:nth-last-child(-n+3){grid-column:auto;aspect-ratio:3/1.15}.list.grid .slice .logo{max-height:34%}}
</style>
</head>
<body>
<nav class="rail" aria-hidden="true"><b>物</b><i class="on"></i><i></i><i></i><i></i></nav>
<button class="fab" aria-label="Menu">☰</button>
<main class="main"><header class="hero" id="hero"></header><div class="home v2" id="app"></div></main>
<script src="home-data.js"></script>
<script src="home-titles.js"></script>
<script src="common.js"></script>
<script>
const t = (b) => TITLES[b.id] || {};
const CHOICE = { '5003': 59 }; // cardPools kind "choiceness", changeList length (demo: hard-coded from MasterData)
const slice = (b) => {
  const choice = CHOICE[b.id];
  const big = b.ups.length ? b.ups.map((u) => u.name).join(' · ') : cn(b.name_cn);
  const meta = choice ? `Tự chọn trong ${choice} Khí Giả · còn <b>${remaining(b.end)}</b>` : `${TYPE_VI[b.type]} · còn <b>${remaining(b.end)}</b>`;
  return `<a class="slice ${choice ? 'choice' : ''}" href="${b.ups[0] ? '#/characters/' + b.ups[0].slug : '#/banners'}">
    ${b.art ? `<img class="bg" src="${b.art}" alt="">` : ''}${b.drawing ? `<img class="fig" src="${b.drawing}" alt="">` : ''}
    
    <span class="txt">${t(b).title ? `<img class="logo" src="${t(b).title}" alt="${b.name_cn}">` : ''}<span class="big">${big}</span><span class="meta">${meta}</span></span></a>`;
};
const events = HOME.events.filter((e) => e.start * 1000 <= NOW && NOW < e.end * 1000);
const V = HOME.version, theme = HOME.events.find((e) => e.kind_cn === '主题活动');
document.getElementById('hero').innerHTML = `<img src="${HOME.hero.art}" alt="Ảnh chủ đề phiên bản ${V.label}"><div class="ht">
  <span class="ver">Phiên bản ${V.label} · ${fmt(V.start)} – ${fmt(V.end)}</span><h1>${cn(HOME.hero.name_cn)}</h1>
  ${theme ? `<p>Sự kiện chủ đề ${cn(theme.name_cn)} · còn <b>${remaining(theme.end)}</b></p>` : ''}</div>`;
document.getElementById('app').innerHTML = `
<section><h2>Banner đang mở <a href="#/banners">Tất cả banner ›</a></h2><div class="list grid ${HOME.current.length % 2 ? 'odd' : ''}">${HOME.current.map(slice).join('')}</div></section>
<div class="row2">
  <section><h2>Sự kiện đang diễn ra</h2>${events.map((e) => `<div class="ev"><span class="k">${cn(e.kind_cn)}</span><span class="n">${cn(e.name_cn)}</span><span class="l">Còn <b>${remaining(e.end)}</b></span></div>`).join('')}</section>
  <section><h2>Mới ra mắt</h2><div class="rel">${HOME.releases.map((r) => `<a href="#"><img src="${r.image}" alt="">${r.name}<small>${r.kind === 'skin' ? 'Trang phục' : 'Khí Giả'}</small></a>`).join('')}</div></section>
</div>`;
</script>
</body>
</html>
