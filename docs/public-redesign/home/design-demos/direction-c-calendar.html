<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · C · Lịch phiên bản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<!--
  Direction C · "Lịch phiên bản" (reference: a museum's exhibition calendar / the Rijksmuseum "now on" schedule, crossed
  with the site's own lore ticket).
  Form from content: everything on this page is bounded in time — a version, banners, events. So the page is a
  calendar: one ruler from the version start to the last end date, every banner and event a bar on it, a gold
  "Hôm nay" line through all of them. Below, each banner is an admission ticket (the lore-ticket material: grain,
  gold hairline, perforation, pool id as the serial).
  Phone: the ruler becomes a list — each row with its own elapsed bar and the time left.
  Motion: bars grow from their start date in order (0.6 s expo-out), the gold line fades in last; reduced motion = none.
-->
<style>
.wrap{max-width:1280px;margin:0 auto}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px;align-items:stretch}
.title{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:8px 0}
.title .ver{font:700 48px/1 var(--serif);color:var(--gold);letter-spacing:.04em}
.title h1{font:700 26px/1.25 var(--serif)}
.title p{color:var(--ash);font-size:14px}
.title p b{color:var(--text);font-weight:600}
.kv{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kv img{display:block;width:100%;aspect-ratio:21/9;object-fit:cover;object-position:50% 30%}
h2{font:600 16px/1.3 var(--sans);margin:40px 0 12px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 24px 24px;position:relative}
.axis{position:relative;height:24px;margin-left:220px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--ash)}
.axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.axis span::after{content:'';position:absolute;left:50%;top:18px;height:6px;border-left:1px solid var(--line2)}
.lanes{position:relative}
.lane{display:grid;grid-template-columns:220px 1fr;align-items:center;min-height:40px;border-bottom:1px solid var(--line)}
.lane .lab{padding-right:16px;font-size:14px;line-height:1.3;overflow:hidden}
.lane .lab small{display:block;font-size:12px;color:var(--ash)}
.track{position:relative;height:40px}
.b{position:absolute;top:10px;height:20px;border-radius:6px;background:var(--lifted);border:1px solid var(--goldline);display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-size:12px;color:var(--text);white-space:nowrap;transform-origin:left}
.b.ev{background:none;border-color:var(--line2);color:var(--ash)}
.b .done{position:absolute;inset:0 auto 0 0;background:var(--goldwash);border-radius:6px 0 0 6px}
.b em{position:relative;font-style:normal}
.today{position:absolute;top:-24px;bottom:0;border-left:2px solid var(--gold)}
.today span{position:absolute;top:-22px;left:-2px;background:var(--surface);padding:0 4px;font:600 12px var(--sans);color:var(--gold);white-space:nowrap}
/* tickets */
.tickets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ticket{background:var(--grain),var(--surface);border:1px solid var(--goldline);display:flex;flex-direction:column}
.ticket .art{border-bottom:1px dashed var(--goldline)}
.tb{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.no{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ash)}
.no b{font:700 20px var(--serif);letter-spacing:.14em;color:var(--gold);font-variant-numeric:tabular-nums}
.tn{font:600 20px/1.3 var(--serif)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.facts dt{color:var(--ash)} .facts dd{margin:0}
.facts a:hover{color:var(--gold)}
.stub{position:relative;margin-top:4px;padding:12px 16px;border-top:1px dashed var(--goldline);display:flex;justify-content:space-between;font-size:14px;color:var(--ash)}
.stub::before,.stub::after{content:'';position:absolute;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:1px solid var(--goldline)}
.stub::before{left:-7px}.stub::after{right:-7px}
.stub b{color:var(--gold);font-weight:600}
.ticket.small{display:grid;grid-template-columns:44% minmax(0,1fr)}.ticket.small .art{grid-row:span 2;border-bottom:0;border-right:1px dashed var(--goldline);height:100%}
.ticket.small .stub::before{display:none}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.rel{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 16px}
.rel a{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.3}
.rel a:nth-last-child(-n+2){border-bottom:0}
.rel img{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:1px solid var(--line2);background:var(--lifted)}
.rel small{display:block;font-size:12px;color:var(--ash)}
.rel time{font-size:13px;color:var(--ash)} .rel time.new{color:var(--gold);font-weight:600}
.short{display:flex;flex-wrap:wrap;gap:8px}
.short a{height:36px;display:inline-flex;align-items:center;padding:0 16px;border:1px solid var(--line2);border-radius:6px;font-size:14px}
.short a:hover{background:var(--hover)}
/* Banner page strip: a chronology */
.chrono{position:relative;padding-left:24px;border-left:1px solid var(--golddiv);margin-left:8px}
.chrono .it{position:relative;display:grid;grid-template-columns:96px 160px 1fr;gap:16px;align-items:center;padding:8px 0}
.chrono .it::before{content:'';position:absolute;left:-29px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;background:var(--bg);border:1px solid var(--gold)}
.chrono time{font-size:13px;color:var(--ash);font-variant-numeric:tabular-nums}
.chrono .art{border:1px solid var(--line);border-radius:6px}
.chrono b{font:500 16px 'Noto Serif SC',serif} .chrono small{display:block;color:var(--ash);font-size:13px}
.year{font:700 17px var(--serif);margin:16px 0 8px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.filters select{height:36px;background:var(--lifted);color:var(--text);border:1px solid #34383D;border-radius:6px;padding:0 12px;font:14px var(--sans)}
.mob{display:none}
@media (max-width:980px){.tickets{grid-template-columns:1fr 1fr}.pair{grid-template-columns:1fr}.top{grid-template-columns:1fr}.title{order:2}}
@media (max-width:760px){
 .cal .axis,.cal .lanes{display:none}.mob{display:block}.cal{padding:4px 16px}
 .mrow{padding:12px 0;border-bottom:1px solid var(--line)}.mrow:last-child{border-bottom:0}
 .mrow .h{display:flex;justify-content:space-between;gap:12px;font-size:14px}.mrow .h small{color:var(--ash);font-size:12px;display:block}
 .mrow .h b{white-space:nowrap;font-weight:600;color:var(--gold);font-size:13px}
 .mrow .bar{height:4px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}.mrow .bar i{display:block;height:100%;background:var(--gold)}
}
@media (max-width:640px){
 .title .ver{font-size:36px}.title h1{font-size:22px}
 .tickets{grid-template-columns:1fr}.ticket.small{display:flex;flex-direction:column}.ticket.small .art{height:auto;border-right:0;border-bottom:1px dashed var(--goldline)}.ticket.small .stub::before{display:block}
 .rel{grid-template-columns:1fr}.rel a:nth-last-child(2){border-bottom:1px solid var(--line)}
 .chrono .it{grid-template-columns:112px 1fr;gap:4px 12px}.chrono time{grid-column:1/-1}
}
</style>
</head>
<body>
<nav class="rail" aria-hidden="true"><b>物</b><i class="on"></i><i></i><i></i><i></i><i></i></nav>
<button class="fab" aria-label="Menu">☰</button>
<main class="main"><div class="wrap" id="app"></div></main>
<script src="home-data.js"></script>
<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const H = HOME, v = H.version;
const events = H.events.filter((e) => e.start * 1000 <= NOW && NOW < e.end * 1000);
const items = [...featured.map((b) => ({ ...b, k: 'b' })), ...compact.map((b) => ({ ...b, k: 'b' })), ...events.map((e) => ({ ...e, k: 'ev' }))];
const t0 = Math.min(v.start, ...items.map((x) => x.start)), t1 = Math.max(v.end, ...items.map((x) => x.end));
const pct = (s) => ((s - t0) / (t1 - t0)) * 100;
const ticks = []; for (let s = t0; s <= t1; s += 7 * 86400) ticks.push(s);
const label = (x) => x.k === 'b' ? `${cn(x.name_cn)}<small>${x.ups.length ? x.ups.map((u) => u.name).join(', ') : 'Banner'}</small>` : `${cn(x.name_cn)}<small>${x.kind_cn}</small>`;
const ticket = (b, small) => `<article class="ticket ${small ? 'small' : ''} blk">${layered(b)}<div class="tb">
  <p class="no"><span>${TYPE_VI[b.type]}</span><b>Nº ${b.id}</b></p><h3 class="tn">${cn(b.name_cn)}</h3>
  <dl class="facts"><dt>Mở</dt><dd>${fmt(b.start)} – ${fmt(b.end)}</dd>${b.ups.length ? `<dt>UP</dt><dd>${b.ups.map((u) => `<a href="#/characters/${u.slug}">${u.name}</a>`).join(', ')}</dd>` : ''}${b.drawing ? `<dt>Trang phục</dt><dd><a href="#/skins">${b.skin_name} ›</a></dd>` : ''}</dl></div>
  ${small ? '' : ''}<div class="stub"><span>Còn lại</span><b>${remaining(b.end)}</b></div></article>`;
document.getElementById('app').innerHTML = `
<header class="top blk"><div class="title"><span class="ver">${v.label}</span><h1>${cn(H.hero.name_cn)}</h1>
  <p>${fmt(v.start)} – ${fmt(v.end)} · còn <b>${remaining(v.end)}</b></p></div>
  <div class="kv"><img src="${H.hero.art}" alt="Ảnh chủ đề phiên bản ${v.label}"></div></header>
<h2>Đang diễn ra</h2>
<div class="cal blk"><div class="axis">${ticks.map((s) => `<span style="left:${pct(s)}%">${fmtShort(s)}</span>`).join('')}</div>
  <div class="lanes">${items.map((x) => `<div class="lane"><div class="lab">${label(x)}</div><div class="track"><div class="b ${x.k}" style="left:${pct(x.start)}%;width:${pct(x.end) - pct(x.start)}%"><span class="done" style="width:${progress(x) * 100}%"></span><em>${remaining(x.end)}</em></div></div></div>`).join('')}
  <div class="today" style="left:calc(220px + (100% - 220px) * ${pct(NOW / 1000) / 100})"><span>Hôm nay</span></div></div>
  <div class="mob">${items.map((x) => `<div class="mrow"><div class="h"><span>${label(x)}</span><b>Còn ${remaining(x.end)}</b></div><div class="bar"><i style="width:${progress(x) * 100}%"></i></div></div>`).join('')}</div></div>
<h2>Banner đang mở</h2>
<div class="tickets">${featured.map((b) => ticket(b)).join('')}</div>
<div class="pair">${compact.map((b) => ticket(b, true)).join('')}</div>
<h2>Mới ra mắt</h2>
<div class="rel blk">${H.releases.map((r) => `<a href="#"><img src="${r.image}" alt=""><span>${r.name}<small>${r.kind === 'skin' ? 'Trang phục · ' + r.char : 'Khí Giả'}</small></span><time class="${r.isNew ? 'new' : ''}">${r.isNew ? 'Mới · ' : ''}${fmtShort(r.date)}</time></a>`).join('')}</div>
<h2>Lối tắt</h2><nav class="short blk">${SHORTCUTS.map(([l, h]) => `<a href="${h}">${l}</a>`).join('')}</nav>
<p class="demo-label">Trang Banner (#/banners) — biên niên theo năm</p>
<h1 style="font:700 26px var(--serif);margin-bottom:16px">Banner</h1>
<div class="filters"><select><option>Khí Giả: tất cả</option></select><select><option>Loại: tất cả</option></select><select><option>Năm: tất cả</option></select></div>
${years(H.archive).map((y) => `<h2 class="year">${y}</h2><div class="chrono">${H.archive.map((b) => `<div class="it"><time>${fmtShort(b.start)} – ${fmtShort(b.end)}</time>${layered(b)}<span><b>${b.name_cn}<span class="dot"></span></b><small>${TYPE_VI[b.type]} · ${b.ups.map((u) => u.name).join(', ')}</small></span></div>`).join('')}</div>`).join('')}`;
reveal('.blk');
if (window.gsap && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  gsap.from('.lane .b', { scaleX: 0, duration: .6, ease: 'expo.out', stagger: .05, delay: .2 });
  gsap.from('.today', { opacity: 0, duration: .4, delay: .7 });
}
</script>
</body>
</html>
