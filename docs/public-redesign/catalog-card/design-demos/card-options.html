<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thẻ Khí Giả · 3 hướng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,600;7..72,700;7..72,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../home/design-demos/common.css">
<!--
  Owner 2026-09-30: the white game ticket clashes with the dark site; the rarity fade (ui_ty_kp_pz_*) reads well as a
  short rarity mark; the game's own 限 seal (printed in the card art of all 11 is_limited characters, checked) should
  mark Limited instead of the site's red border. Three options on the same characters:
   1 · Vé game (white ticket, as in the game)   2 · Vé tối (the ticket silhouette recoloured to the site's slate,
   hairline frame)   3 · Không khung (art + rarity fade + job; the name under the art).
-->
<style>
.wrap{max-width:1360px;margin:0 auto}
h2{font:600 16px var(--sans);margin:28px 0 12px}
h2 small{font:400 13px var(--sans);color:var(--ash);margin-left:8px}
.row{display:grid;grid-template-columns:repeat(6,minmax(0,170px));gap:20px 16px}
.tk{position:relative;display:block;aspect-ratio:146/333;background:center/100% 100% no-repeat;transition:transform .25s cubic-bezier(.16,1,.3,1)}
.tk:hover{transform:translateY(-4px)}
.tk-art{position:absolute;left:0;top:0;width:100%;height:87.69%;overflow:hidden}
.tk-art img{width:100%;height:100%;object-fit:cover;display:block}
/* glow and job live inside the art window (146 x 292): glow = its last 58 px, job just above the foot */
.tk-glow{position:absolute;left:0;width:100%;bottom:0;height:19.86%;background:center/100% 100% no-repeat}
[data-rare="4"] .tk-glow{background-image:url(assets/ui_ty_kp_pz_4.png)}
[data-rare="3"] .tk-glow{background-image:url(assets/ui_ty_kp_pz_3.png)}
[data-rare="2"] .tk-glow{background-image:url(assets/ui_ty_kp_pz_2.png)}
.tk-frame{position:absolute;left:0;top:0;width:100%;height:87.69%;background:center/100% 100% no-repeat}
.tk-job{position:absolute;left:37.5%;width:25%;bottom:4.1%;aspect-ratio:1}
.tk-job img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgb(0 0 0/.8)) drop-shadow(0 0 6px rgb(0 0 0/.5))}
.tk-name{position:absolute;left:6%;right:6%;top:88.3%;height:9.4%;display:flex;align-items:center;justify-content:center;text-align:center;font:800 13px/1.12 var(--serif);text-wrap:balance;overflow:hidden}
.tk-name.long{font-size:11.5px}
/* 1 · game ticket */
.v1 .tk{background-image:url(assets/ticket-base.png)} .v1 .tk-frame{background-image:url(assets/ui_ty_kp_bian.png)} .v1 .tk-name{color:#232126}
/* 2 · dark ticket: same silhouette and scalloped stub, in the site's slate; hairline frame */
.v2 .tk{background-image:url(assets/ticket-base-dark.png)} .v2 .tk-frame{background-image:url(assets/bian-dark.png)} .v2 .tk-name{color:var(--text)}
/* 3 · frameless: art with 6 px corners, the fade and the job icon; name below */
.v3 .tk{aspect-ratio:auto;background:none}
.v3 .tk-art{position:relative;height:auto;aspect-ratio:1/2;border-radius:6px}
.v3 .tk-name{position:static;height:auto;margin-top:8px;font:700 14px/1.3 var(--serif);color:var(--text)}
</style>
</head>
<body>
<nav class="rail" aria-hidden="true"><b>物</b><i class="on"></i><i></i><i></i><i></i></nav>
<main class="main"><div class="wrap" id="app"></div></main>
<script src="catalog-data.js"></script>
<script>
const pick = ['A0184', 'A0144', 'W0097', 'A0003', 'A0033', 'A0001'].map((id) => CHARS.find((c) => c.id === id));
const ticket = (c) => `<a class="tk" data-rare="${c.rare}" href="#"><span class="tk-art"><img src="${c.card}" alt=""><span class="tk-glow"></span>
  <span class="tk-job"><img src="../../../../public/assets/jobs/job_${c.job}.png" alt=""></span></span><span class="tk-frame"></span><span class="tk-name${c.vi.length > 16 ? ' long' : ''}">${c.vi}</span></a>`;
app.innerHTML = [['v1', '1 · Vé game', 'viền trắng và cuống kem như trong game'], ['v2', '2 · Vé tối', 'cùng dáng vé, cuống răng cưa, đổi sang màu slate của site, viền hairline'],
  ['v3', '3 · Không khung', 'ảnh bo 6 px + quầng độ hiếm + job, tên dưới ảnh']]
  .map(([cls, t, s]) => `<h2>${t}<small>${s} · Limited = dấu 限 trong ảnh (Thác Kim Bác Sơn Lư, Thiên Cầu Nghi)</small></h2><div class="row ${cls}">${pick.map(ticket).join('')}</div>`).join('');
</script>
</body>
</html>
