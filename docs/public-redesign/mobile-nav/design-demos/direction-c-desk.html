<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mobile nav · C · Bàn tra cứu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@500;700&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<!--
  Direction C · "Bàn tra cứu" (search first; the lookup desk mid-game, PRODUCT.md: "often mid-session, on a phone").
  Assumptions: phones ≤ 768 px; no dock; ☰ bottom-left under the report badge.
  Motion (GSAP, the one authored moment): the menu grows out of the ☰ button as a circle (clip-path, 0.5 s expo-out)
  and folds back into it on close; the big search field is focused; pages are a 2 × 2 tile grid; results are an
  avatar grid (3 per row) that arrives in order.
-->
<style>
:root{--bg:#111315;--surface:#17191C;--lifted:#1C2024;--hover:#22262B;--line:#2B2F34;--line2:#3D434A;--text:#E3E5E8;--ash:#9097A0;--gold:#D4B763;--goldline:rgba(212,183,99,.3)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;gap:14px;background:#0a0b0c;font-family:Inter,system-ui,sans-serif;color:var(--text);padding:24px}
.cap{font-size:13px;color:var(--ash);text-align:center;max-width:390px}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);border-radius:28px;outline:1px solid var(--line)}
.fab{position:absolute;left:16px;z-index:30;display:grid;place-items:center;width:44px;height:44px;color:var(--ash);background:rgba(23,25,28,.92);border:1px solid var(--goldline);border-radius:6px;cursor:pointer}
.fab-report{bottom:72px}.fab-menu{bottom:20px;color:var(--text)}
.fab:focus-visible,.tile:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.big input:focus{outline:none} .big:focus-within{border-bottom-color:#E7C96D} /* the 2 px gold rule is the focus mark */
.desk{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;padding:28px 20px 90px;background:var(--surface);clip-path:circle(0 at 38px calc(100% - 42px))}
.big{display:flex;align-items:center;gap:12px;padding:0 0 12px;border-bottom:2px solid var(--gold);color:var(--gold)}
.big input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:600 22px/1.3 Inter,system-ui,sans-serif;padding:6px 0}
.big input::placeholder{color:var(--ash);font-weight:500}
.hint{margin:8px 0 22px;font-size:12px;color:var(--ash)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:10px;align-content:space-between;min-height:104px;padding:14px;background:var(--lifted);border:1px solid var(--line);border-radius:6px;color:var(--text);text-align:left;cursor:pointer}
.tile:hover{background:var(--hover)}.tile b{font:600 16px Inter,system-ui,sans-serif}.tile small{display:block;margin-top:2px;font:500 12px 'Noto Serif SC',serif;color:var(--ash)}
.tile.on{border-color:var(--goldline)}.tile.on svg{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.card{display:grid;justify-items:center;gap:6px;padding:0;background:none;border:0;color:var(--text);text-align:center;cursor:pointer}
.card img{width:64px;height:64px;border-radius:50%;border:2px solid var(--line2);background:var(--lifted);object-fit:cover}
.card b{font:500 13px/1.3 Inter,system-ui,sans-serif}.card em{font-style:normal;font-size:12px;color:var(--ash)}
.acct{margin-top:auto;display:inline-flex;gap:8px;align-items:center;align-self:flex-start;margin-left:56px;padding:0;background:none;border:0;color:var(--ash);font:14px Inter,system-ui,sans-serif;cursor:pointer}
.empty{color:var(--ash);font-size:14px}
</style>
</head>
<body>
<div class="phone">
  <div id="page"></div>
  <div class="desk" id="desk" role="dialog" aria-label="Menu và tìm kiếm">
    <label class="big" id="big"><input id="q" placeholder="Tìm Khí Giả, trang phục" autocomplete="off"></label>
    <p class="hint">Gõ không dấu cũng được · tên tiếng Trung cũng được</p>
    <div id="body"></div>
    <button class="acct" id="acct"></button>
  </div>
  <button class="fab fab-report" aria-label="Báo lỗi"></button>
  <button class="fab fab-menu" id="menu" aria-label="Menu" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line id="l1" x1="4" y1="6" x2="20" y2="6"/><line id="l2" x1="4" y1="12" x2="20" y2="12"/><line id="l3" x1="4" y1="18" x2="20" y2="18"/></svg>
  </button>
</div>
<p class="cap">C · Bàn tra cứu — menu nở ra từ nút ☰ (vòng tròn), ô tìm kiếm lớn tự focus, 4 trang thành ô 2 × 2, kết quả là lưới avatar.</p>
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script src="search-data.js"></script>
<script src="mock-common.js"></script>
<script>
document.head.insertAdjacentHTML('beforeend', `<style>${FAKE_PAGE_CSS}</style>`);
document.getElementById('page').innerHTML = fakePage();
document.getElementById('big').insertAdjacentHTML('afterbegin', icon('search', 22));
document.querySelector('.fab-report').innerHTML = icon('flag', 18);
document.getElementById('acct').innerHTML = icon('login', 18) + 'Đăng nhập';
const desk = document.getElementById('desk'), body = document.getElementById('body'), q = document.getElementById('q'), menu = document.getElementById('menu');
const tilesHtml = () => `<div class="tiles">${NAV.map((n) => `<button class="tile${n.active ? ' on' : ''}">${icon(n.icon, 22)}<span><b>${n.label}</b><small>${n.cn}</small></span></button>`).join('')}</div>`;
const resHtml = (r) => r.length ? `<div class="grid">${r.map((x) => `<button class="card"><img src="${avatar(x.avatar)}" alt=""><b>${x.title}</b><em>${x.kind === 'Khí Giả' ? x.sub : 'Trang phục'}</em></button>`).join('')}</div>` : '<p class="empty">Không tìm thấy. Thử tên tiếng Trung hoặc bỏ dấu.</p>';
const arrive = () => gsap.fromTo(body.querySelectorAll('.tile,.card,.empty'), { opacity: 0, y: 8, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: 'expo.out', stagger: 0.03 });
let open = false;
function morph(toX) {
  gsap.to('#l1', { attr: toX ? { x1: 6, y1: 6, x2: 18, y2: 18 } : { x1: 4, y1: 6, x2: 20, y2: 6 }, duration: 0.3, ease: 'expo.out' });
  gsap.to('#l2', { opacity: toX ? 0 : 1, duration: 0.15 });
  gsap.to('#l3', { attr: toX ? { x1: 6, y1: 18, x2: 18, y2: 6 } : { x1: 4, y1: 18, x2: 20, y2: 18 }, duration: 0.3, ease: 'expo.out' });
}
function toggle() {
  open = !open; menu.setAttribute('aria-expanded', open); morph(open);
  if (open) {
    body.innerHTML = tilesHtml(); q.value = '';
    gsap.set(desk, { display: 'flex' });
    gsap.fromTo(desk, { clipPath: 'circle(0px at 38px calc(100% - 42px))' }, { clipPath: 'circle(1000px at 38px calc(100% - 42px))', duration: 0.55, ease: 'expo.out', onComplete: () => q.focus() });
    gsap.fromTo([document.getElementById('big'), ...body.querySelectorAll('.tile')], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out', stagger: 0.04, delay: 0.08 });
  } else gsap.to(desk, { clipPath: 'circle(0px at 38px calc(100% - 42px))', duration: 0.3, ease: 'power2.in', onComplete: () => gsap.set(desk, { display: 'none' }) });
}
menu.onclick = toggle;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) toggle(); });
q.oninput = () => { body.innerHTML = q.value.trim() ? resHtml(searchAll(q.value, 9)) : tilesHtml(); arrive(); };
</script>
</body>
</html>
