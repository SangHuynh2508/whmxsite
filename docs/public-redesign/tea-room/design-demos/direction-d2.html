<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../home/design-demos/common.css"><title>Phòng Trà · D2</title>
<!-- D2 (owner 2026-10-03: "thêm thông tin của từng loại trà", "tận dụng khoảng trống bên phải"): the band becomes three columns,
     moon window | the three teas as a vertical tab list | the chosen tea: icon, name, the tea's own description (itemMap,
     shared by every character, translated once in Từ điển) and the character's comment on it in a paper box.
     Rest as D.
     D · Trộn: B's moon-window + tea shelf + comment, as a full-width band on top (no empty column
     under the art); A's layout below (sticky stage rail on the left, the width used); B's dialogue (option slip on one
     side, the character's paper box with a name plaque on the other), but two exchanges per row so the page is about
     half as long. 契合: the two branches stand side by side, each a column (opener, then its two follow-ups). -->
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1280px;margin:0 auto}
.head{display:flex;gap:16px;align-items:center;padding:8px 0 16px}
.head img{width:56px;height:56px;border-radius:50%;border:2px solid var(--line2)}
.head h1{font:700 21px/1.3 var(--serif)} .head p{color:var(--ash);font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs a{padding:8px 14px;font-size:13px;color:var(--ash);white-space:nowrap;border-bottom:2px solid transparent}
.tabs a.on{color:var(--text);border-color:var(--gold)}
.demo{font-size:12px;color:var(--ash);margin:-8px 0 24px}
/* band: moon window | tea list | tea detail */
.band{display:grid;grid-template-columns:280px 220px minmax(0,1fr);gap:32px;align-items:center;padding-bottom:32px}
.moon{position:relative;aspect-ratio:1;border-radius:50%;border:1px solid var(--goldline);overflow:hidden;background:var(--surface) var(--grain)}
.moon::after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid var(--golddiv);pointer-events:none}
.moon img{position:absolute;left:50%;top:4%;height:150%;width:auto;transform:translateX(-50%);max-width:none}
.teas h2{font:600 16px/1.3 var(--sans)}
.teas .hint{font-size:13px;color:var(--ash);margin-top:4px}
.shelf{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.jar{all:unset;box-sizing:border-box;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:6px 10px 6px 6px;border:1px solid transparent;border-radius:6px;cursor:pointer;color:var(--ash)}
.jar:hover{background:var(--hover);color:var(--text)}
.jar:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.jar img{width:48px;height:48px}
.jar b{display:block;font:500 14px/1.3 var(--sans)}
.jar .cn{font-size:12px;color:var(--ash)}
.jar[aria-selected=true]{background:var(--lifted);border-color:var(--line2);color:var(--text)}
.detail{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 20px;align-content:start}
.detail>img{width:96px;height:96px;grid-row:span 2}
.detail h3{font:600 20px/1.3 var(--serif);align-self:end}
.detail h3 .cn{font-size:14px;color:var(--ash);font-weight:500;margin-left:8px}
.detail .desc{font-size:14px;line-height:1.7;color:var(--ash);max-width:66ch}
.detail .box{grid-column:1/-1;max-width:none;margin-top:20px}
/* sections (A) */
.sec{display:grid;grid-template-columns:180px minmax(0,1fr);gap:0 32px;padding:32px 0;border-top:1px solid var(--line2)}
.srail{position:sticky;top:16px;align-self:start}
.srail .cal{display:flex;gap:4px}
.srail .cal img{height:52px;width:auto}
.srail h2{font:600 18px/1.3 var(--serif);margin-top:8px}
.srail p{font-size:13px;color:var(--ash);margin-top:4px;max-width:24ch}
/* dialogue (B), two per row */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 32px}
.ex{display:flex;flex-direction:column}
.opt{display:flex;justify-content:flex-end}
.opt>span{max-width:85%;padding:8px 14px;border:1px solid var(--line2);border-radius:6px;background:var(--lifted);font-size:14px;text-align:right}
.opt b{font-weight:500} .opt .cn{display:block;font-size:13px;color:var(--ash)}
.box{position:relative;margin-top:16px;padding:20px 18px 14px;border:1px solid var(--goldline);border-radius:6px;background:var(--surface) var(--grain);max-width:94%}
.plq{position:absolute;top:-11px;left:14px;padding:1px 10px;font:600 12px/1.6 var(--serif);background:var(--goldwash);border:1px solid var(--goldline);border-radius:6px;color:var(--gold)}
.box p{font-size:15px;line-height:1.75}
.box.narr{background:transparent;border-style:dashed;border-color:var(--line2)}
.box.narr p{color:var(--ash);font-style:italic}
.rx{position:absolute;right:-14px;top:-14px;display:grid;place-items:center;width:40px;height:34px;border-radius:6px;background:#d8cfbd;border:1px solid var(--goldline)}
.rx img{height:24px;width:auto}
.branch{display:flex;flex-direction:column;gap:0}
.follow{margin:16px 0 0 24px;padding-left:16px;border-left:1px solid var(--goldline);display:flex;flex-direction:column;gap:20px}
.follow .box{max-width:100%}
.end{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px;padding:24px;border:1px solid var(--goldline);border-radius:6px;background:var(--surface) var(--grain)}
.end h3{font:600 13px/1.3 var(--sans);color:var(--ash);margin-bottom:4px}
.end p{font-size:15px;line-height:1.7}
.poem{grid-column:1/-1;text-align:center;font:500 18px/1.9 var(--serif);white-space:pre-line;padding-top:16px;border-top:1px dashed var(--goldline)}
.poem .cn{display:block;font-size:13px;color:var(--ash)}
@media (max-width:1100px){.grid{grid-template-columns:1fr}.band{grid-template-columns:220px minmax(0,1fr)}.band .moon{grid-row:span 2}.band .teas{grid-column:2}.band .detail{grid-column:1/-1}}
@media (max-width:768px){
 .band{grid-template-columns:1fr;gap:16px}.band .moon{width:min(220px,60vw);justify-self:center;grid-row:auto}.band .teas{grid-column:auto}
 .shelf{flex-direction:row;gap:4px}.jar{grid-template-columns:1fr;justify-items:center;text-align:center;flex:1;padding:6px 4px}.jar img{width:56px;height:56px}
 .detail{grid-template-columns:64px minmax(0,1fr);gap:4px 12px}.detail>img{width:64px;height:64px}.detail h3{font-size:17px}
 .sec{grid-template-columns:1fr;gap:16px;padding:24px 0}
 .srail{position:static;display:flex;gap:12px;align-items:center}.srail h2{margin:0;font-size:17px}.srail p{display:none}.srail .cal img{height:40px}
 .box,.opt>span{max-width:100%}.rx{right:-6px}
 .follow{margin-left:8px;padding-left:12px}
 .end{grid-template-columns:1fr;padding:16px}}
</style></head><body>
<nav class="rail" aria-hidden="true"><b>物</b><i></i><i class="on"></i><i></i><i></i></nav>
<main class="main"><div class="wrap">
 <header class="head"><img src="../../../../public/assets/characters/avatars/V0112.png" alt=""><div><h1 id="nm"></h1><p class="cn" id="nc"></p></div></header>
 <nav class="tabs" aria-label="Điều hướng nhân vật"><a>Tổng Quan</a><a>Thông Tin</a><a>Thiên Phú</a><a>Build</a><a>Hồ Sơ Lưu Trữ</a><a class="on" aria-current="page">Phòng Trà</a><a>Thư Viện</a></nav>
 <p class="demo">Demo: chữ Việt chỉ minh họa bố cục, không phải bản dịch. Câu có chấm nhỏ là chưa dịch. Bấm vào loại trà để xem mô tả và lời bình.</p>
 <section class="band">
  <div class="moon"><img src="https://pub-c0dceaa4fc5b48d1811c48f6f91a899c.r2.dev/characters/v0112/drawings/v0112001.webp" alt=""></div>
  <div class="teas"><h2>Trà yêu thích</h2><p class="hint">Mời đúng loại trà, khí giả sẽ bình về nó.</p>
   <div class="shelf" id="shelf" role="tablist" aria-label="Trà yêu thích"></div></div>
  <div class="detail" id="detail" role="tabpanel" aria-live="polite"></div>
 </section>
 <div id="talk"></div>
</div></main>
<script src="tea-data.js"></script>
<script>
const T = TEA, c = T.char;
nm.textContent = c.vi; nc.textContent = c.cn;
shelf.innerHTML = T.teas.map((t, i) => `<button class="jar" role="tab" data-i="${i}" aria-selected="false"><img src="${t.img}" alt=""><span><b>${esc(t.vi)}</b><span class="cn" lang="zh">${esc(t.cn)}</span></span></button>`).join('');
const showTea = (i) => { const t = T.teas[i];
  detail.innerHTML = `<img src="${t.img}" alt=""><h3>${esc(t.vi)}<span class="cn" lang="zh">${esc(t.cn)}</span></h3><p class="desc">${txt(t.desc_vi, t.desc)}</p>
   <div class="box"><span class="plq">${esc(c.vi)}</span><p>${txt(t.comment_vi, t.comment)}</p></div>`;
  shelf.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', b.dataset.i == i)); };
shelf.onclick = (e) => { const b = e.target.closest('button'); if (b) showTea(+b.dataset.i); };
showTea(2);
const rx = (r) => r ? `<span class="rx"><img src="${REACT[r].img}" alt="${REACT[r].label}"></span>` : '';
const opt = (t) => `<div class="opt"><span><b>${esc(t.vi)}</b><span class="cn" lang="zh">${esc(t.cn)}</span></span></div>`;
const box = (cn, vi, r) => isNarration(cn)
  ? `<div class="box narr">${rx(r)}<p>${txt(vi, cn)}</p></div>`
  : `<div class="box"><span class="plq">${esc(c.vi)}</span>${rx(r)}<p>${txt(vi, cn)}</p></div>`;
const ex = (t) => `<div class="ex">${opt(t)}${box(t.reply, t.reply_vi, t.r)}</div>`;
const cal = (...s) => `<div class="cal">${s.map((x) => `<img src="${x.img}" alt="${x.cn}">`).join('')}</div>`;
talk.innerHTML = `
<section class="sec"><div class="srail">${cal(T.stages[0], T.stages[1])}<h2>${T.stages[0].vi} · ${T.stages[1].vi}</h2><p>Câu 1 và câu 2. Mỗi câu, game hiện 3 trong 8 chủ đề.</p></div>
 <div class="grid">${T.topics.map(ex).join('')}</div></section>
<section class="sec"><div class="srail">${cal(T.stages[2])}<h2>${T.stages[2].vi}</h2><p>Câu 3 và câu 4. Game hiện 2 chủ đề, chủ đề đã chọn mở ra 2 câu tiếp.</p></div>
 <div class="grid">${T.branches.map((b) => `<div class="branch">${ex(b)}<div class="follow">${b.next.map(ex).join('')}</div></div>`).join('')}</div></section>
<section class="sec"><div class="srail"><h2>Kết thúc tiệc trà</h2></div>
 <div class="end"><div><h3>Khi thành công</h3><p>${txt(T.win_vi, T.win)}</p></div><div><h3>Khi thất bại</h3><p>${txt(T.lose_vi, T.lose)}</p></div>
 <p class="poem">${esc(T.result.vi)}<span class="cn" lang="zh">${esc(T.result.cn.replace(/\n/g, ' / '))}</span></p></div></section>`;
</script>
</body></html>
