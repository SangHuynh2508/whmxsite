<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../home/design-demos/common.css"><title>Phòng Trà · B · Cửa trăng</title>
<!-- B · Cửa trăng (real reference: the game's own 品茗 screen, owner screenshots 2026-10-03). The character stands in a
     round moon-window (hairline gold circle) and stays put while the talk scrolls beside her, as in the game. The game's
     "话题进度" bar becomes the section stepper 缘起 → 相知 → 契合 (anchor links). Lines are paper dialogue boxes: archive-slate
     + gold hairline + grain, the archival-object treatment of the lore ticket; the speaker's name sits on a plaque like
     the game's name tag. The player's choice is a right-aligned option slip, like the game's option buttons. Form from
     the content: you sit across from someone, so the page sits you across from her. -->
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1280px;margin:0 auto}
.head{display:flex;gap:16px;align-items:center;padding:8px 0 16px}
.head img{width:56px;height:56px;border-radius:50%;border:2px solid var(--line2)}
.head h1{font:700 21px/1.3 var(--serif)} .head p{color:var(--ash);font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs a{padding:8px 14px;font-size:13px;color:var(--ash);white-space:nowrap;border-bottom:2px solid transparent}
.tabs a.on{color:var(--text);border-color:var(--gold)}
.demo{font-size:12px;color:var(--ash);margin:-8px 0 24px}
.room{display:grid;grid-template-columns:380px minmax(0,1fr);gap:40px}
/* the window */
.win{position:sticky;top:16px;align-self:start}
.moon{position:relative;aspect-ratio:1;border-radius:50%;border:1px solid var(--goldline);overflow:hidden;background:var(--surface) var(--grain)}
.moon::after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid var(--golddiv);pointer-events:none}
.moon img{position:absolute;left:50%;top:4%;height:150%;width:auto;transform:translateX(-50%);max-width:none}
.shelf{display:flex;justify-content:center;gap:16px;margin-top:-28px;position:relative}
.jar{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;width:96px;text-align:center;cursor:pointer;border-radius:6px}
.jar:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.jar img{height:84px;width:auto;border-radius:6px;transition:transform .2s}
.jar:hover img{transform:translateY(-2px)}
.jar b{font:500 13px/1.3 var(--sans);margin-top:6px}
.jar .cn{font-size:12px;color:var(--ash)}
.jar[aria-pressed=true] b{color:var(--gold)}
.sip{margin-top:16px;padding:16px 18px;border:1px solid var(--goldline);border-radius:6px;background:var(--surface) var(--grain);font-size:14px;line-height:1.7;min-height:96px}
/* stepper */
.steps{display:flex;align-items:center;gap:8px;padding:8px 0 24px;position:sticky;top:0;background:var(--bg);z-index:2}
.steps a{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:6px;color:var(--ash);font-size:13px}
.steps a img{height:40px;width:auto}
.steps a:hover{background:var(--hover);color:var(--text)}
.steps i{flex:1;height:1px;background:var(--line2);min-width:12px}
h2.st{display:flex;align-items:center;gap:12px;font:600 20px/1.3 var(--serif);margin:32px 0 6px}
h2.st img{height:52px;width:auto}
.rule{font-size:13px;color:var(--ash);margin-bottom:16px}
/* talk */
.ex{margin-bottom:20px}
.opt{display:flex;justify-content:flex-end}
.opt>span{max-width:80%;padding:8px 14px;border:1px solid var(--line2);border-radius:6px;background:var(--lifted);font-size:14px;text-align:right}
.opt b{font-weight:500} .opt .cn{display:block;font-size:13px;color:var(--ash)}
.box{position:relative;margin-top:16px;padding:20px 18px 14px;border:1px solid var(--goldline);border-radius:6px;background:var(--surface) var(--grain);max-width:88%}
.plq{position:absolute;top:-11px;left:14px;padding:1px 10px;font:600 12px/1.6 var(--serif);background:var(--goldwash);border:1px solid var(--goldline);border-radius:6px;color:var(--gold)}
.box p{font-size:15px;line-height:1.75}
.box.narr{background:transparent;border-style:dashed;border-color:var(--line2)}
.box.narr p{color:var(--ash);font-style:italic}
.rx{position:absolute;right:-14px;top:-14px;display:grid;place-items:center;width:40px;height:34px;border-radius:6px;background:#d8cfbd;border:1px solid var(--goldline)}
.rx img{height:24px;width:auto}
.branch{padding:16px 0 8px 0;margin-top:8px;border-top:1px solid var(--line)}
.follow{margin:8px 0 0 32px;padding-left:16px;border-left:1px solid var(--goldline)}
.end{margin-top:32px;padding:24px;border:1px solid var(--goldline);border-radius:6px;background:var(--surface) var(--grain);display:grid;grid-template-columns:1fr 1fr;gap:16px 32px}
.end h3{font:600 13px/1.3 var(--sans);color:var(--ash);margin-bottom:4px}
.end p{font-size:15px;line-height:1.7}
.poem{grid-column:1/-1;text-align:center;font:500 18px/1.9 var(--serif);white-space:pre-line;padding-top:16px;border-top:1px dashed var(--goldline)}
.poem .cn{display:block;font-size:13px;color:var(--ash)}
@media (max-width:980px){.room{grid-template-columns:1fr;gap:0}
 .win{position:static;display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center;margin-bottom:8px}
 .moon{width:160px}.shelf{margin:0;justify-content:flex-start;gap:8px}.jar{width:72px}.jar img{height:60px}
 .sip{grid-column:1/-1;margin-top:0}}
@media (max-width:640px){
 .win{grid-template-columns:120px 1fr}.moon{width:120px}.jar{width:64px}.jar img{height:52px}.jar .cn{display:none}
 .steps a span{display:none}.steps a img{height:36px}
 .box,.opt>span{max-width:100%}.rx{right:-6px}
 .follow{margin-left:12px;padding-left:12px}
 .end{grid-template-columns:1fr;padding:16px}}
</style></head><body>
<nav class="rail" aria-hidden="true"><b>物</b><i></i><i class="on"></i><i></i><i></i></nav>
<main class="main"><div class="wrap">
 <header class="head"><img src="../../../../public/assets/characters/avatars/V0112.png" alt=""><div><h1 id="nm"></h1><p class="cn" id="nc"></p></div></header>
 <nav class="tabs" aria-label="Điều hướng nhân vật"><a>Tổng Quan</a><a>Thông Tin</a><a>Thiên Phú</a><a>Build</a><a>Hồ Sơ Lưu Trữ</a><a class="on" aria-current="page">Phòng Trà</a><a>Thư Viện</a></nav>
 <p class="demo">Demo: chữ Việt chỉ minh họa bố cục, không phải bản dịch. Câu có chấm nhỏ là chưa dịch. Bấm vào loại trà để đọc lời bình.</p>
 <div class="room">
  <aside class="win">
   <div class="moon"><img src="https://pub-c0dceaa4fc5b48d1811c48f6f91a899c.r2.dev/characters/v0112/drawings/v0112001.webp" alt=""></div>
   <div><div class="shelf" id="shelf" role="group" aria-label="Trà yêu thích"></div></div>
   <p class="sip" id="sip" aria-live="polite"></p>
  </aside>
  <div id="talk"></div>
 </div>
</div></main>
<script src="tea-data.js"></script>
<script>
const T = TEA, c = T.char;
nm.textContent = c.vi; nc.textContent = c.cn;
shelf.innerHTML = T.teas.map((t, i) => `<button class="jar" data-i="${i}" aria-pressed="false"><img src="${t.img}" alt=""><b>${esc(t.vi)}</b><span class="cn" lang="zh">${esc(t.cn)}</span></button>`).join('');
const showTea = (i) => { sip.innerHTML = txt(T.teas[i].comment_vi, T.teas[i].comment);
  shelf.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.i == i)); };
shelf.onclick = (e) => { const b = e.target.closest('button'); if (b) showTea(+b.dataset.i); };
showTea(2);
const rx = (r) => r ? `<span class="rx"><img src="${REACT[r].img}" alt="${REACT[r].label}"></span>` : '';
const opt = (t) => `<div class="opt"><span><b>${esc(t.vi)}</b><span class="cn" lang="zh">${esc(t.cn)}</span></span></div>`;
const box = (cn, vi, r) => isNarration(cn)
  ? `<div class="box narr">${rx(r)}<p>${txt(vi, cn)}</p></div>`
  : `<div class="box"><span class="plq">${esc(c.vi)}</span>${rx(r)}<p>${txt(vi, cn)}</p></div>`;
const st = (s) => `<img src="${s.img}" alt="${s.cn}">`;
talk.innerHTML = `
<nav class="steps" aria-label="Các chặng">
 <a href="#s1">${st(T.stages[0])}<span>${T.stages[0].vi}</span></a><i></i>
 <a href="#s1">${st(T.stages[1])}<span>${T.stages[1].vi}</span></a><i></i>
 <a href="#s3">${st(T.stages[2])}<span>${T.stages[2].vi}</span></a><i></i>
 <a href="#s4"><span>Kết thúc</span></a>
</nav>
<h2 class="st" id="s1">${st(T.stages[0])}${st(T.stages[1])}${T.stages[0].vi} · ${T.stages[1].vi}</h2>
<p class="rule">Câu 1 và câu 2: mỗi câu, game hiện 3 trong 8 chủ đề này.</p>
${T.topics.map((t) => `<div class="ex">${opt(t)}${box(t.reply, t.reply_vi, t.r)}</div>`).join('')}
<h2 class="st" id="s3">${st(T.stages[2])}${T.stages[2].vi}</h2>
<p class="rule">Câu 3 và câu 4: game hiện 2 chủ đề, chủ đề đã chọn mở ra 2 câu tiếp.</p>
${T.branches.map((b) => `<div class="branch"><div class="ex">${opt(b)}${box(b.reply, b.reply_vi)}</div>
 <div class="follow">${b.next.map((n) => `<div class="ex">${opt(n)}${box(n.reply, n.reply_vi, n.r)}</div>`).join('')}</div></div>`).join('')}
<section class="end" id="s4"><div><h3>Khi thành công</h3><p>${txt(T.win_vi, T.win)}</p></div><div><h3>Khi thất bại</h3><p>${txt(T.lose_vi, T.lose)}</p></div>
 <p class="poem">${esc(T.result.vi)}<span class="cn" lang="zh">${esc(T.result.cn.replace(/\n/g, ' / '))}</span></p></section>`;
</script>
</body></html>
